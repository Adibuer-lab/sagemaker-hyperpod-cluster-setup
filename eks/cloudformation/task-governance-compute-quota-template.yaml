Description: Create HyperPod Task Governance compute allocations per team (waits for Kueue readiness)

Parameters:
  ResourceNamePrefix:
    Type: String
    Default: sagemaker-hyperpod-eks
  EKSClusterName:
    Type: String
  HyperPodClusterArn:
    Type: String
    Description: ARN of the HyperPod cluster.
  CustomResourceS3Bucket:
    Type: String
    Default: aws-sagemaker-hyperpod-cluster-setup-us-east-2-prod
  LayerS3Key:
    Type: String
    Default: resources/artifacts/ds-setup-lambda-layer.zip
    Description: Lambda layer with kubectl and aws-iam-authenticator
  FunctionS3Key:
    Type: String
    Default: resources/artifacts/task-governance-compute-quota-lambda-function.zip
  StarterFunctionS3Key:
    Type: String
    Default: resources/artifacts/cfn-stepfunction-starter-lambda-function.zip
  ResponseFunctionS3Key:
    Type: String
    Default: resources/artifacts/cfn-response-sender-lambda-function.zip
  StepFunctionMaxAttempts:
    Type: Number
    Default: 45
  StepFunctionDelaySeconds:
    Type: Number
    Default: 60
  TeamNamespaces:
    Type: String
    Description: Comma-separated list of team namespaces (hyperpod-ns-<team>).
  ComputeQuotaInstanceType:
    Type: String
    Default: ml.p4d.24xlarge
  ComputeQuotaInstanceCount:
    Type: Number
    Default: 4
  ComputeQuotaFairShareWeight:
    Type: Number
    Default: 50
  ComputeQuotaBorrowLimit:
    Type: Number
    Default: 50
  ComputeQuotaSharingStrategy:
    Type: String
    Default: LendAndBorrow
    AllowedValues:
      - Lend
      - DontLend
      - LendAndBorrow
  ComputeQuotaPreemptTeamTasks:
    Type: String
    Default: LowerPriority
    AllowedValues:
      - Never
      - LowerPriority

Resources:
  TaskGovernanceComputeQuotaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: ${ResourceNamePrefix}-tg-compute-quota-role
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
        Version: '2012-10-17'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - eks:DescribeCluster
                  - eks:AssociateAccessPolicy
                  - eks:ListAssociatedAccessPolicies
                Resource:
                  Fn::Sub: arn:aws:eks:${AWS::Region}:${AWS::AccountId}:cluster/${EKSClusterName}
              - Effect: Allow
                Action:
                  - sagemaker:DescribeCluster
                Resource:
                  Ref: HyperPodClusterArn
              - Effect: Allow
                Action:
                  - sagemaker:ListComputeQuotas
                Resource: '*'
              - Effect: Allow
                Action:
                  - sagemaker:CreateComputeQuota
                Resource:
                  - Ref: HyperPodClusterArn
                  - Fn::Sub: arn:aws:sagemaker:${AWS::Region}:${AWS::AccountId}:compute-quota/*
              - Effect: Allow
                Action:
                  - sagemaker:DescribeComputeQuota
                  - sagemaker:UpdateComputeQuota
                  - sagemaker:DeleteComputeQuota
                  - sagemaker:AddTags
                Resource:
                  Fn::Sub: arn:aws:sagemaker:${AWS::Region}:${AWS::AccountId}:compute-quota/*
              - Effect: Allow
                Action: sts:GetCallerIdentity
                Resource: '*'
          PolicyName: TGComputeQuotaAccess

  TaskGovernanceComputeQuotaAccessEntry:
    Type: AWS::EKS::AccessEntry
    Properties:
      AccessPolicies:
        - AccessScope:
            Type: cluster
          PolicyArn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
      ClusterName:
        Ref: EKSClusterName
      PrincipalArn:
        Fn::GetAtt:
          - TaskGovernanceComputeQuotaRole
          - Arn

  TaskGovernanceComputeQuotaLayer:
    Type: AWS::Lambda::LayerVersion
    Properties:
      CompatibleArchitectures:
        - x86_64
      CompatibleRuntimes:
        - python3.9
        - python3.10
        - python3.11
        - python3.12
      Content:
        S3Bucket:
          Ref: CustomResourceS3Bucket
        S3Key:
          Ref: LayerS3Key
      Description: Lambda Layer for kubectl and aws-iam-authenticator
      LayerName:
        Fn::Sub: ${ResourceNamePrefix}-tg-compute-quota-layer

  TaskGovernanceComputeQuotaFunction:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        S3Bucket:
          Ref: CustomResourceS3Bucket
        S3Key:
          Ref: FunctionS3Key
      Environment:
        Variables:
          EKS_CLUSTER_NAME:
            Ref: EKSClusterName
          HYPERPOD_CLUSTER_ARN:
            Ref: HyperPodClusterArn
          TEAM_NAMESPACES:
            Ref: TeamNamespaces
          COMPUTE_QUOTA_INSTANCE_TYPE:
            Ref: ComputeQuotaInstanceType
          COMPUTE_QUOTA_INSTANCE_COUNT:
            Ref: ComputeQuotaInstanceCount
          COMPUTE_QUOTA_FAIR_SHARE_WEIGHT:
            Ref: ComputeQuotaFairShareWeight
          COMPUTE_QUOTA_BORROW_LIMIT:
            Ref: ComputeQuotaBorrowLimit
          COMPUTE_QUOTA_SHARING_STRATEGY:
            Ref: ComputeQuotaSharingStrategy
          COMPUTE_QUOTA_PREEMPT_TEAM_TASKS:
            Ref: ComputeQuotaPreemptTeamTasks
          RESOURCE_NAME_PREFIX:
            Ref: ResourceNamePrefix
          PATH: /opt/python/bin:/var/lang/bin:/usr/local/bin:/usr/bin/:/bin
          KUBECONFIG: /tmp/.kube/config
          LD_LIBRARY_PATH: /opt/python/lib
      FunctionName:
        Fn::Sub: ${ResourceNamePrefix}-tg-compute-quota
      Handler: lambda_function.handler
      Layers:
        - Ref: TaskGovernanceComputeQuotaLayer
      Role:
        Fn::GetAtt:
          - TaskGovernanceComputeQuotaRole
          - Arn
      Runtime: python3.12
      Timeout: 600
    DependsOn:
      - TaskGovernanceComputeQuotaAccessEntry

  TaskGovernanceComputeQuotaResponseRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
        Version: '2012-10-17'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  TaskGovernanceComputeQuotaResponseFunction:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        S3Bucket:
          Ref: CustomResourceS3Bucket
        S3Key:
          Ref: ResponseFunctionS3Key
      FunctionName:
        Fn::Sub: ${ResourceNamePrefix}-tg-compute-quota-response
      Handler: lambda_function.handler
      Role:
        Fn::GetAtt:
          - TaskGovernanceComputeQuotaResponseRole
          - Arn
      Runtime: python3.12
      Timeout: 60
      MemorySize: 256

  TaskGovernanceComputeQuotaStateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: states.amazonaws.com
        Version: '2012-10-17'
      Policies:
        - PolicyName: TGComputeQuotaStateMachinePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - Fn::GetAtt:
                      - TaskGovernanceComputeQuotaFunction
                      - Arn
                  - Fn::GetAtt:
                      - TaskGovernanceComputeQuotaResponseFunction
                      - Arn

  TaskGovernanceComputeQuotaStateMachine:
    Type: AWS::StepFunctions::StateMachine
    DependsOn:
      - TaskGovernanceComputeQuotaFunction
      - TaskGovernanceComputeQuotaResponseFunction
    Properties:
      StateMachineName:
        Fn::Sub: ${ResourceNamePrefix}-tg-compute-quota-sfn
      StateMachineType: STANDARD
      RoleArn:
        Fn::GetAtt:
          - TaskGovernanceComputeQuotaStateMachineRole
          - Arn
      DefinitionString:
        Fn::Sub: |
          {
            "Comment": "Task Governance compute quota orchestration",
            "StartAt": "InvokeWorker",
            "States": {
              "InvokeWorker": {
                "Type": "Task",
                "Resource": "arn:aws:states:::lambda:invoke",
                "Parameters": {
                  "FunctionName": "${TaskGovernanceComputeQuotaFunction}",
                  "Payload": {
                    "RequestType.$": "$.RequestType",
                    "Attempt.$": "$.Attempt",
                    "MaxAttempts.$": "$.MaxAttempts",
                    "DelaySeconds.$": "$.DelaySeconds"
                  }
                },
                "ResultSelector": {
                  "Status.$": "$.Payload.Status",
                  "Reason.$": "$.Payload.Reason",
                  "Data.$": "$.Payload.Data",
                  "Attempt.$": "$.Payload.Attempt",
                  "MaxAttempts.$": "$.Payload.MaxAttempts",
                  "DelaySeconds.$": "$.Payload.DelaySeconds"
                },
                "ResultPath": "$.Worker",
                "Next": "SetAttempt",
                "Catch": [
                  {
                    "ErrorEquals": ["States.ALL"],
                    "ResultPath": "$.WorkerError",
                    "Next": "SendFailureFromException"
                  }
                ]
              },
              "SetAttempt": {
                "Type": "Pass",
                "Parameters": {
                  "RequestType.$": "$.RequestType",
                  "ResponseURL.$": "$.ResponseURL",
                  "StackId.$": "$.StackId",
                  "RequestId.$": "$.RequestId",
                  "LogicalResourceId.$": "$.LogicalResourceId",
                  "PhysicalResourceId.$": "$.PhysicalResourceId",
                  "Attempt.$": "$.Worker.Attempt",
                  "MaxAttempts.$": "$.Worker.MaxAttempts",
                  "DelaySeconds.$": "$.Worker.DelaySeconds",
                  "Worker.$": "$.Worker"
                },
                "ResultPath": "$",
                "Next": "CheckStatus"
              },
              "CheckStatus": {
                "Type": "Choice",
                "Choices": [
                  {
                    "Variable": "$.Worker.Status",
                    "StringEquals": "SUCCESS",
                    "Next": "SendSuccess"
                  },
                  {
                    "Variable": "$.Worker.Status",
                    "StringEquals": "NOT_READY",
                    "Next": "CheckAttempts"
                  }
                ],
                "Default": "SendFailure"
              },
              "CheckAttempts": {
                "Type": "Choice",
                "Choices": [
                  {
                    "Variable": "$.Worker.Attempt",
                    "NumericGreaterThanEqualsPath": "$.Worker.MaxAttempts",
                    "Next": "SendTimeoutFailure"
                  }
                ],
                "Default": "WaitBeforeRetry"
              },
              "WaitBeforeRetry": {
                "Type": "Wait",
                "SecondsPath": "$.Worker.DelaySeconds",
                "Next": "InvokeWorker"
              },
              "SendSuccess": {
                "Type": "Task",
                "Resource": "arn:aws:states:::lambda:invoke",
                "Parameters": {
                  "FunctionName": "${TaskGovernanceComputeQuotaResponseFunction}",
                  "Payload": {
                    "Status": "SUCCESS",
                    "Reason.$": "$.Worker.Reason",
                    "Data.$": "$.Worker.Data",
                    "ResponseURL.$": "$.ResponseURL",
                    "StackId.$": "$.StackId",
                    "RequestId.$": "$.RequestId",
                    "LogicalResourceId.$": "$.LogicalResourceId",
                    "PhysicalResourceId.$": "$.PhysicalResourceId"
                  }
                },
                "End": true
              },
              "SendFailure": {
                "Type": "Task",
                "Resource": "arn:aws:states:::lambda:invoke",
                "Parameters": {
                  "FunctionName": "${TaskGovernanceComputeQuotaResponseFunction}",
                  "Payload": {
                    "Status": "FAILED",
                    "Reason.$": "$.Worker.Reason",
                    "Data.$": "$.Worker.Data",
                    "ResponseURL.$": "$.ResponseURL",
                    "StackId.$": "$.StackId",
                    "RequestId.$": "$.RequestId",
                    "LogicalResourceId.$": "$.LogicalResourceId",
                    "PhysicalResourceId.$": "$.PhysicalResourceId"
                  }
                },
                "End": true
              },
              "SendTimeoutFailure": {
                "Type": "Task",
                "Resource": "arn:aws:states:::lambda:invoke",
                "Parameters": {
                  "FunctionName": "${TaskGovernanceComputeQuotaResponseFunction}",
                  "Payload": {
                    "Status": "FAILED",
                    "Reason": "Timed out waiting for Task Governance readiness",
                    "Data": {
                      "Error": "Timed out waiting for Task Governance readiness"
                    },
                    "ResponseURL.$": "$.ResponseURL",
                    "StackId.$": "$.StackId",
                    "RequestId.$": "$.RequestId",
                    "LogicalResourceId.$": "$.LogicalResourceId",
                    "PhysicalResourceId.$": "$.PhysicalResourceId"
                  }
                },
                "End": true
              },
              "SendFailureFromException": {
                "Type": "Task",
                "Resource": "arn:aws:states:::lambda:invoke",
                "Parameters": {
                  "FunctionName": "${TaskGovernanceComputeQuotaResponseFunction}",
                  "Payload": {
                    "Status": "FAILED",
                    "Reason.$": "$.WorkerError.Cause",
                    "Data": {
                      "Error.$": "$.WorkerError.Error"
                    },
                    "ResponseURL.$": "$.ResponseURL",
                    "StackId.$": "$.StackId",
                    "RequestId.$": "$.RequestId",
                    "LogicalResourceId.$": "$.LogicalResourceId",
                    "PhysicalResourceId.$": "$.PhysicalResourceId"
                  }
                },
                "End": true
              }
            }
          }

  TaskGovernanceComputeQuotaStarterRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
        Version: '2012-10-17'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: TGComputeQuotaStartPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - states:StartExecution
                Resource:
                  Ref: TaskGovernanceComputeQuotaStateMachine

  TaskGovernanceComputeQuotaStarterFunction:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        S3Bucket:
          Ref: CustomResourceS3Bucket
        S3Key:
          Ref: StarterFunctionS3Key
      Environment:
        Variables:
          STATE_MACHINE_ARN:
            Ref: TaskGovernanceComputeQuotaStateMachine
          MAX_ATTEMPTS:
            Ref: StepFunctionMaxAttempts
          DELAY_SECONDS:
            Ref: StepFunctionDelaySeconds
      FunctionName:
        Fn::Sub: ${ResourceNamePrefix}-tg-compute-quota-starter
      Handler: lambda_function.handler
      Role:
        Fn::GetAtt:
          - TaskGovernanceComputeQuotaStarterRole
          - Arn
      Runtime: python3.12
      Timeout: 60
      MemorySize: 256

  TaskGovernanceComputeQuotaCustomResource:
    Type: AWS::CloudFormation::CustomResource
    DependsOn:
      - TaskGovernanceComputeQuotaStateMachine
    Properties:
      ServiceToken:
        Fn::GetAtt:
          - TaskGovernanceComputeQuotaStarterFunction
          - Arn
