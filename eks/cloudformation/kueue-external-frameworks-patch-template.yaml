Description: Patch Kueue manager configuration to include external frameworks

Parameters:
  ResourceNamePrefix:
    Type: String
    Default: sagemaker-hyperpod-eks
  EKSClusterName:
    Type: String
  CustomResourceS3Bucket:
    Type: String
    Default: aws-sagemaker-hyperpod-cluster-setup-us-east-2-prod
  FunctionS3Key:
    Type: String
    Default: resources/artifacts/kueue-external-frameworks-patch-lambda-function.zip
  KueueNamespace:
    Type: String
    Default: kueue-system
  KueueConfigMapName:
    Type: String
    Default: kueue-manager-config
  KueueDeploymentName:
    Type: String
    Default: kueue-controller-manager
  ExternalFrameworks:
    Type: String
    Default: HyperPodPytorchJob.v1.sagemaker.amazonaws.com

Resources:
  KueueExternalFrameworksPatchRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: ${ResourceNamePrefix}-kueue-external-frameworks-patch-role
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
        Version: '2012-10-17'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: eks:DescribeCluster
                Resource:
                  Fn::Sub: arn:aws:eks:${AWS::Region}:${AWS::AccountId}:cluster/${EKSClusterName}
              - Effect: Allow
                Action: sts:GetCallerIdentity
                Resource: '*'
          PolicyName: EKSAccess

  KueueExternalFrameworksPatchAccessEntry:
    Type: AWS::EKS::AccessEntry
    Properties:
      AccessPolicies:
        - AccessScope:
            Type: cluster
          PolicyArn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
      ClusterName:
        Ref: EKSClusterName
      PrincipalArn:
        Fn::GetAtt:
          - KueueExternalFrameworksPatchRole
          - Arn

  KueueExternalFrameworksPatchFunction:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        S3Bucket:
          Ref: CustomResourceS3Bucket
        S3Key:
          Ref: FunctionS3Key
      Environment:
        Variables:
          EKS_CLUSTER_NAME:
            Ref: EKSClusterName
          KUEUE_NAMESPACE:
            Ref: KueueNamespace
          KUEUE_CONFIGMAP_NAME:
            Ref: KueueConfigMapName
          KUEUE_DEPLOYMENT_NAME:
            Ref: KueueDeploymentName
          EXTERNAL_FRAMEWORKS:
            Ref: ExternalFrameworks
      FunctionName:
        Fn::Sub: ${ResourceNamePrefix}-kueue-external-frameworks-patch
      Handler: lambda_function.handler
      Role:
        Fn::GetAtt:
          - KueueExternalFrameworksPatchRole
          - Arn
      Runtime: python3.12
      Timeout: 300
    DependsOn:
      - KueueExternalFrameworksPatchAccessEntry

  KueueExternalFrameworksPatchCustomResource:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken:
        Fn::GetAtt:
          - KueueExternalFrameworksPatchFunction
          - Arn

Outputs:
  ExternalFrameworksPatched:
    Description: External frameworks patch applied
    Value: true
