Description: Patch Kueue manager configuration to include external frameworks

Parameters:
  ResourceNamePrefix:
    Type: String
    Default: sagemaker-hyperpod-eks
  EKSClusterName:
    Type: String
  CustomResourceS3Bucket:
    Type: String
    Default: aws-sagemaker-hyperpod-cluster-setup-us-east-2-prod
  FunctionS3Key:
    Type: String
    Default: resources/artifacts/kueue-external-frameworks-patch-lambda-function.zip
  StarterFunctionS3Key:
    Type: String
    Default: resources/artifacts/cfn-stepfunction-starter-lambda-function.zip
  ResponseFunctionS3Key:
    Type: String
    Default: resources/artifacts/cfn-response-sender-lambda-function.zip
  StepFunctionMaxAttempts:
    Type: Number
    Default: 45
  StepFunctionDelaySeconds:
    Type: Number
    Default: 60
  KueueNamespace:
    Type: String
    Default: kueue-system
  KueueConfigMapName:
    Type: String
    Default: kueue-manager-config
  KueueDeploymentName:
    Type: String
    Default: kueue-controller-manager
  ExternalFrameworks:
    Type: String
    Default: HyperPodPytorchJob.v1.sagemaker.amazonaws.com
  WaitForPodsReadyEnabled:
    Type: String
    Default: ''
    Description: Enable waitForPodsReady in Kueue controller config
  WaitForPodsReadyTimeout:
    Type: String
    Default: ''
    Description: waitForPodsReady timeout duration (e.g., 20m)
  WaitForPodsReadyRequeueBackoffLimit:
    Type: String
    Default: ''
    Description: waitForPodsReady requeue backoff limit

Resources:
  KueueExternalFrameworksPatchRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: ${ResourceNamePrefix}-kue-ex-patch
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
        Version: '2012-10-17'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: eks:DescribeCluster
                Resource:
                  Fn::Sub: arn:aws:eks:${AWS::Region}:${AWS::AccountId}:cluster/${EKSClusterName}
              - Effect: Allow
                Action: sts:GetCallerIdentity
                Resource: '*'
          PolicyName: EKSAccess

  KueueExternalFrameworksPatchAccessEntry:
    Type: AWS::EKS::AccessEntry
    Properties:
      AccessPolicies:
        - AccessScope:
            Type: cluster
          PolicyArn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
      ClusterName:
        Ref: EKSClusterName
      PrincipalArn:
        Fn::GetAtt:
          - KueueExternalFrameworksPatchRole
          - Arn

  KueueExternalFrameworksPatchFunction:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        S3Bucket:
          Ref: CustomResourceS3Bucket
        S3Key:
          Ref: FunctionS3Key
      Environment:
        Variables:
          EKS_CLUSTER_NAME:
            Ref: EKSClusterName
          KUEUE_NAMESPACE:
            Ref: KueueNamespace
          KUEUE_CONFIGMAP_NAME:
            Ref: KueueConfigMapName
          KUEUE_DEPLOYMENT_NAME:
            Ref: KueueDeploymentName
          EXTERNAL_FRAMEWORKS:
            Ref: ExternalFrameworks
          WAIT_FOR_PODS_READY_ENABLED:
            Ref: WaitForPodsReadyEnabled
          WAIT_FOR_PODS_READY_TIMEOUT:
            Ref: WaitForPodsReadyTimeout
          WAIT_FOR_PODS_READY_REQUEUE_BACKOFF_LIMIT:
            Ref: WaitForPodsReadyRequeueBackoffLimit
      FunctionName:
        Fn::Sub: ${ResourceNamePrefix}-kueue-external-frameworks-patch
      Handler: lambda_function.handler
      Role:
        Fn::GetAtt:
          - KueueExternalFrameworksPatchRole
          - Arn
      Runtime: python3.12
      Timeout: 300
    DependsOn:
      - KueueExternalFrameworksPatchAccessEntry

  KueueExternalFrameworksPatchResponseRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
        Version: '2012-10-17'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  KueueExternalFrameworksPatchResponseFunction:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        S3Bucket:
          Ref: CustomResourceS3Bucket
        S3Key:
          Ref: ResponseFunctionS3Key
      FunctionName:
        Fn::Sub: ${ResourceNamePrefix}-kueue-external-frameworks-response
      Handler: lambda_function.handler
      Role:
        Fn::GetAtt:
          - KueueExternalFrameworksPatchResponseRole
          - Arn
      Runtime: python3.12
      Timeout: 60
      MemorySize: 256

  KueueExternalFrameworksPatchStateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: states.amazonaws.com
        Version: '2012-10-17'
      Policies:
        - PolicyName: KueueExternalFrameworksPatchStateMachinePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - Fn::GetAtt:
                      - KueueExternalFrameworksPatchFunction
                      - Arn
                  - Fn::GetAtt:
                      - KueueExternalFrameworksPatchResponseFunction
                      - Arn

  KueueExternalFrameworksPatchStateMachine:
    Type: AWS::StepFunctions::StateMachine
    DependsOn:
      - KueueExternalFrameworksPatchFunction
      - KueueExternalFrameworksPatchResponseFunction
    Properties:
      StateMachineName:
        Fn::Sub: ${ResourceNamePrefix}-kueue-external-frameworks-sfn
      StateMachineType: STANDARD
      RoleArn:
        Fn::GetAtt:
          - KueueExternalFrameworksPatchStateMachineRole
          - Arn
      DefinitionString:
        Fn::Sub: |
          {
            "Comment": "Kueue external frameworks patch orchestration",
            "StartAt": "InvokeWorker",
            "States": {
              "InvokeWorker": {
                "Type": "Task",
                "Resource": "arn:aws:states:::lambda:invoke",
                "Parameters": {
                  "FunctionName": "${KueueExternalFrameworksPatchFunction}",
                  "Payload": {
                    "RequestType.$": "$.RequestType",
                    "Attempt.$": "$.Attempt",
                    "MaxAttempts.$": "$.MaxAttempts",
                    "DelaySeconds.$": "$.DelaySeconds"
                  }
                },
                "ResultSelector": {
                  "Status.$": "$.Payload.Status",
                  "Reason.$": "$.Payload.Reason",
                  "Data.$": "$.Payload.Data",
                  "Attempt.$": "$.Payload.Attempt",
                  "MaxAttempts.$": "$.Payload.MaxAttempts",
                  "DelaySeconds.$": "$.Payload.DelaySeconds"
                },
                "ResultPath": "$.Worker",
                "Next": "SetAttempt",
                "Catch": [
                  {
                    "ErrorEquals": ["States.ALL"],
                    "ResultPath": "$.WorkerError",
                    "Next": "SendFailureFromException"
                  }
                ]
              },
              "SetAttempt": {
                "Type": "Pass",
                "Parameters": {
                  "RequestType.$": "$.RequestType",
                  "ResponseURL.$": "$.ResponseURL",
                  "StackId.$": "$.StackId",
                  "RequestId.$": "$.RequestId",
                  "LogicalResourceId.$": "$.LogicalResourceId",
                  "PhysicalResourceId.$": "$.PhysicalResourceId",
                  "Attempt.$": "$.Worker.Attempt",
                  "MaxAttempts.$": "$.Worker.MaxAttempts",
                  "DelaySeconds.$": "$.Worker.DelaySeconds",
                  "Worker.$": "$.Worker"
                },
                "ResultPath": "$",
                "Next": "CheckStatus"
              },
              "CheckStatus": {
                "Type": "Choice",
                "Choices": [
                  {
                    "Variable": "$.Worker.Status",
                    "StringEquals": "SUCCESS",
                    "Next": "SendSuccess"
                  },
                  {
                    "Variable": "$.Worker.Status",
                    "StringEquals": "NOT_READY",
                    "Next": "CheckAttempts"
                  }
                ],
                "Default": "SendFailure"
              },
              "CheckAttempts": {
                "Type": "Choice",
                "Choices": [
                  {
                    "Variable": "$.Worker.Attempt",
                    "NumericGreaterThanEqualsPath": "$.Worker.MaxAttempts",
                    "Next": "SendTimeoutFailure"
                  }
                ],
                "Default": "WaitBeforeRetry"
              },
              "WaitBeforeRetry": {
                "Type": "Wait",
                "SecondsPath": "$.Worker.DelaySeconds",
                "Next": "InvokeWorker"
              },
              "SendSuccess": {
                "Type": "Task",
                "Resource": "arn:aws:states:::lambda:invoke",
                "Parameters": {
                  "FunctionName": "${KueueExternalFrameworksPatchResponseFunction}",
                  "Payload": {
                    "Status": "SUCCESS",
                    "Reason.$": "$.Worker.Reason",
                    "Data.$": "$.Worker.Data",
                    "ResponseURL.$": "$.ResponseURL",
                    "StackId.$": "$.StackId",
                    "RequestId.$": "$.RequestId",
                    "LogicalResourceId.$": "$.LogicalResourceId",
                    "PhysicalResourceId.$": "$.PhysicalResourceId"
                  }
                },
                "End": true
              },
              "SendFailure": {
                "Type": "Task",
                "Resource": "arn:aws:states:::lambda:invoke",
                "Parameters": {
                  "FunctionName": "${KueueExternalFrameworksPatchResponseFunction}",
                  "Payload": {
                    "Status": "FAILED",
                    "Reason.$": "$.Worker.Reason",
                    "Data.$": "$.Worker.Data",
                    "ResponseURL.$": "$.ResponseURL",
                    "StackId.$": "$.StackId",
                    "RequestId.$": "$.RequestId",
                    "LogicalResourceId.$": "$.LogicalResourceId",
                    "PhysicalResourceId.$": "$.PhysicalResourceId"
                  }
                },
                "End": true
              },
              "SendTimeoutFailure": {
                "Type": "Task",
                "Resource": "arn:aws:states:::lambda:invoke",
                "Parameters": {
                  "FunctionName": "${KueueExternalFrameworksPatchResponseFunction}",
                  "Payload": {
                    "Status": "FAILED",
                    "Reason": "Timed out waiting for Kueue readiness",
                    "Data": {
                      "Error": "Timed out waiting for Kueue readiness"
                    },
                    "ResponseURL.$": "$.ResponseURL",
                    "StackId.$": "$.StackId",
                    "RequestId.$": "$.RequestId",
                    "LogicalResourceId.$": "$.LogicalResourceId",
                    "PhysicalResourceId.$": "$.PhysicalResourceId"
                  }
                },
                "End": true
              },
              "SendFailureFromException": {
                "Type": "Task",
                "Resource": "arn:aws:states:::lambda:invoke",
                "Parameters": {
                  "FunctionName": "${KueueExternalFrameworksPatchResponseFunction}",
                  "Payload": {
                    "Status": "FAILED",
                    "Reason.$": "$.WorkerError.Cause",
                    "Data": {
                      "Error.$": "$.WorkerError.Error"
                    },
                    "ResponseURL.$": "$.ResponseURL",
                    "StackId.$": "$.StackId",
                    "RequestId.$": "$.RequestId",
                    "LogicalResourceId.$": "$.LogicalResourceId",
                    "PhysicalResourceId.$": "$.PhysicalResourceId"
                  }
                },
                "End": true
              }
            }
          }

  KueueExternalFrameworksPatchStarterRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
        Version: '2012-10-17'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: KueueExternalFrameworksPatchStartPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - states:StartExecution
                Resource:
                  Ref: KueueExternalFrameworksPatchStateMachine

  KueueExternalFrameworksPatchStarterFunction:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        S3Bucket:
          Ref: CustomResourceS3Bucket
        S3Key:
          Ref: StarterFunctionS3Key
      Environment:
        Variables:
          STATE_MACHINE_ARN:
            Ref: KueueExternalFrameworksPatchStateMachine
          MAX_ATTEMPTS:
            Ref: StepFunctionMaxAttempts
          DELAY_SECONDS:
            Ref: StepFunctionDelaySeconds
      FunctionName:
        Fn::Sub: ${ResourceNamePrefix}-kueue-external-frameworks-starter
      Handler: lambda_function.handler
      Role:
        Fn::GetAtt:
          - KueueExternalFrameworksPatchStarterRole
          - Arn
      Runtime: python3.12
      Timeout: 60
      MemorySize: 256

  KueueExternalFrameworksPatchCustomResource:
    Type: AWS::CloudFormation::CustomResource
    DependsOn:
      - KueueExternalFrameworksPatchStateMachine
    Properties:
      ServiceToken:
        Fn::GetAtt:
          - KueueExternalFrameworksPatchStarterFunction
          - Arn

Outputs:
  ExternalFrameworksPatched:
    Description: External frameworks patch applied
    Value: true
