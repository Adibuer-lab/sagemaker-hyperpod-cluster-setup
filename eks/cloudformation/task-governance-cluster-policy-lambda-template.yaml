Parameters:
  EKSClusterName:
    Type: String
    Description: Name of the EKS cluster
  TaskGovernanceAddonLambdaExportSuffix:
    Type: String
    Default: default
    Description: Suffix to ensure Task Governance Lambda export names are unique per deployment
  Stage:
    Type: String
    Default: prod
    AllowedValues:
      - gamma
      - prod
    Description: Deployment stage (gamma, prod)
  CustomResourceS3Bucket:
    Type: String
    Default: aws-sagemaker-hyperpod-cluster-setup-us-east-2-prod
    Description: The name of the S3 bucket containing the custom resource.
  FunctionS3Key:
    Type: String
    Default: resources/artifacts/task-governance-cluster-policy-lambda.zip
    Description: The S3 key for the lambda function zip file.
  LayerS3Key:
    Type: String
    Default: resources/artifacts/ds-setup-lambda-layer.zip
    Description: Lambda layer with kubectl and aws-iam-authenticator
Resources:
  TaskGovernancePolicyLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: TaskGovernanceSchedulerConfigAccess
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - sagemaker:CreateClusterSchedulerConfig
                  - sagemaker:UpdateClusterSchedulerConfig
                  - sagemaker:DeleteClusterSchedulerConfig
                  - sagemaker:DescribeClusterSchedulerConfig
                  - sagemaker:ListClusterSchedulerConfigs
                  - sagemaker:DescribeCluster
                Resource: '*'
              - Effect: Allow
                Action:
                  - eks:DescribeCluster
                  - eks:DescribeAddon
                  - eks:AssociateAccessPolicy
                  - eks:ListAssociatedAccessPolicies
                  - eks:DescribeAccessEntry
                Resource:
                  - Fn::Sub: arn:aws:eks:${AWS::Region}:${AWS::AccountId}:cluster/${EKSClusterName}
                  - Fn::Sub: arn:aws:eks:${AWS::Region}:${AWS::AccountId}:access-entry/${EKSClusterName}/*
    Metadata:
      aws:cdk:path: TaskGovernanceClusterPolicyLambdaCfnTemplate/TaskGovernancePolicyLambdaRole
  TaskGovernancePolicyLambdaAccessEntry:
    Type: AWS::EKS::AccessEntry
    Properties:
      AccessPolicies:
        - AccessScope:
            Type: cluster
          PolicyArn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
      ClusterName:
        Ref: EKSClusterName
      PrincipalArn:
        Fn::GetAtt:
          - TaskGovernancePolicyLambdaRole
          - Arn

  TaskGovernancePolicyLambdaLayer:
    Type: AWS::Lambda::LayerVersion
    Properties:
      CompatibleArchitectures:
        - x86_64
      CompatibleRuntimes:
        - python3.9
        - python3.10
        - python3.11
        - python3.12
      Content:
        S3Bucket:
          Ref: CustomResourceS3Bucket
        S3Key:
          Ref: LayerS3Key
      Description: Lambda Layer for kubectl and aws-iam-authenticator
      LayerName:
        Fn::Sub: ${EKSClusterName}-tg-cluster-policy-layer
  TaskGovernancePolicyLambda:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        S3Bucket:
          Ref: CustomResourceS3Bucket
        S3Key:
          Ref: FunctionS3Key
      Handler: lambda_function.handler
      Role:
        Fn::GetAtt:
          - TaskGovernancePolicyLambdaRole
          - Arn
      Runtime: python3.9
      Timeout: 300
      Environment:
        Variables:
          EKS_CLUSTER_NAME:
            Ref: EKSClusterName
          PATH: /opt/python/bin:/var/lang/bin:/usr/local/bin:/usr/bin/:/bin
          KUBECONFIG: /tmp/.kube/config
          LD_LIBRARY_PATH: /opt/python/lib
      Layers:
        - Ref: TaskGovernancePolicyLambdaLayer
    DependsOn:
      - TaskGovernancePolicyLambdaAccessEntry
    Metadata:
      aws:cdk:path: TaskGovernanceClusterPolicyLambdaCfnTemplate/TaskGovernancePolicyLambda
Outputs:
  TaskGovernancePolicyLambdaArn:
    Value:
      Fn::GetAtt:
        - TaskGovernancePolicyLambda
        - Arn
    Export:
      Name:
        Fn::Sub: TaskGovernanceAddonLambdaArn-${TaskGovernanceAddonLambdaExportSuffix}
