Description: Create Kueue AZ placement resources (ResourceFlavors, ClusterQueue, LocalQueues)

Parameters:
  ResourceNamePrefix:
    Type: String
    Default: sagemaker-hyperpod-eks
  EKSClusterName:
    Type: String
  CustomResourceS3Bucket:
    Type: String
    Default: aws-sagemaker-hyperpod-cluster-setup-us-east-2-prod
  LayerS3Key:
    Type: String
    Default: resources/artifacts/ds-setup-lambda-layer.zip
    Description: Lambda layer with kubectl and aws-iam-authenticator
  FunctionS3Key:
    Type: String
    Default: resources/artifacts/kueue-az-placement-lambda-function.zip
  StarterFunctionS3Key:
    Type: String
    Default: resources/artifacts/cfn-stepfunction-starter-lambda-function.zip
  ResponseFunctionS3Key:
    Type: String
    Default: resources/artifacts/cfn-response-sender-lambda-function.zip
  StepFunctionMaxAttempts:
    Type: Number
    Default: 45
  StepFunctionDelaySeconds:
    Type: Number
    Default: 60
  EksAvailabilityZones:
    Type: String
    Description: Comma-separated list of EKS-eligible AZ names
  UserNamespaces:
    Type: String
    Description: Comma-separated list of user workload namespaces
  KueueResourceFlavorPrefix:
    Type: String
    Default: nemo-az
  KueueClusterQueueName:
    Type: String
    Default: nemo-az-clusterqueue
  KueueLocalQueueName:
    Type: String
    Default: nemo-az-localqueue
  EnablePerAzQueues:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Create per-AZ ClusterQueues and LocalQueues for rotation
  FsxAvailabilityZoneId:
    Type: String
    Default: ''
  FsxSubnetId:
    Type: String
    Default: ''

Resources:
  KueueAzPlacementRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: ${ResourceNamePrefix}-kueue-az-placement-role
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
        Version: '2012-10-17'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: eks:DescribeCluster
                Resource:
                  Fn::Sub: arn:aws:eks:${AWS::Region}:${AWS::AccountId}:cluster/${EKSClusterName}
              - Effect: Allow
                Action:
                  - ec2:DescribeSubnets
                  - ec2:DescribeAvailabilityZones
                Resource: '*'
          PolicyName: EKSAccess

  KueueAzPlacementAccessEntry:
    Type: AWS::EKS::AccessEntry
    Properties:
      AccessPolicies:
        - AccessScope:
            Type: cluster
          PolicyArn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
      ClusterName:
        Ref: EKSClusterName
      PrincipalArn:
        Fn::GetAtt:
          - KueueAzPlacementRole
          - Arn

  KueueAzPlacementLayer:
    Type: AWS::Lambda::LayerVersion
    Properties:
      CompatibleArchitectures:
        - x86_64
      CompatibleRuntimes:
        - python3.9
        - python3.10
        - python3.11
        - python3.12
      Content:
        S3Bucket:
          Ref: CustomResourceS3Bucket
        S3Key:
          Ref: LayerS3Key
      Description: Lambda layer for kubectl and aws-iam-authenticator
      LayerName:
        Fn::Sub: ${ResourceNamePrefix}-kueue-az-placement-layer

  KueueAzPlacementFunction:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        S3Bucket:
          Ref: CustomResourceS3Bucket
        S3Key:
          Ref: FunctionS3Key
      Environment:
        Variables:
          EKS_CLUSTER_NAME:
            Ref: EKSClusterName
          EKS_AZ_NAMES:
            Ref: EksAvailabilityZones
          USER_NAMESPACES:
            Ref: UserNamespaces
          KUEUE_FLAVOR_PREFIX:
            Ref: KueueResourceFlavorPrefix
          KUEUE_CLUSTER_QUEUE_NAME:
            Ref: KueueClusterQueueName
          KUEUE_LOCAL_QUEUE_NAME:
            Ref: KueueLocalQueueName
          ENABLE_PER_AZ_QUEUES:
            Ref: EnablePerAzQueues
          FSX_AVAILABILITY_ZONE_ID:
            Ref: FsxAvailabilityZoneId
          FSX_SUBNET_ID:
            Ref: FsxSubnetId
          PATH: /opt/python/bin:/var/lang/bin:/usr/local/bin:/usr/bin/:/bin
          KUBECONFIG: /tmp/.kube/config
          LD_LIBRARY_PATH: /opt/python/lib
      FunctionName:
        Fn::Sub: ${ResourceNamePrefix}-kueue-az-placement
      Handler: lambda_function.handler
      Layers:
        - Ref: KueueAzPlacementLayer
      Role:
        Fn::GetAtt:
          - KueueAzPlacementRole
          - Arn
      Runtime: python3.12
      Timeout: 600
    DependsOn:
      - KueueAzPlacementAccessEntry

  KueueAzPlacementResponseRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: ${ResourceNamePrefix}-kueue-az-placement-response-role
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
        Version: '2012-10-17'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  KueueAzPlacementResponseFunction:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        S3Bucket:
          Ref: CustomResourceS3Bucket
        S3Key:
          Ref: ResponseFunctionS3Key
      FunctionName:
        Fn::Sub: ${ResourceNamePrefix}-kueue-az-placement-response
      Handler: lambda_function.handler
      Role:
        Fn::GetAtt:
          - KueueAzPlacementResponseRole
          - Arn
      Runtime: python3.12
      Timeout: 60
      MemorySize: 256

  KueueAzPlacementStateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: ${ResourceNamePrefix}-kueue-az-placement-sfn-role
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: states.amazonaws.com
        Version: '2012-10-17'
      Policies:
        - PolicyName: KueueAzPlacementStateMachinePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - Fn::GetAtt:
                      - KueueAzPlacementFunction
                      - Arn
                  - Fn::GetAtt:
                      - KueueAzPlacementResponseFunction
                      - Arn

  KueueAzPlacementStateMachine:
    Type: AWS::StepFunctions::StateMachine
    DependsOn:
      - KueueAzPlacementFunction
      - KueueAzPlacementResponseFunction
    Properties:
      StateMachineName:
        Fn::Sub: ${ResourceNamePrefix}-kueue-az-placement-sfn
      StateMachineType: STANDARD
      RoleArn:
        Fn::GetAtt:
          - KueueAzPlacementStateMachineRole
          - Arn
      DefinitionString:
        Fn::Sub: |
          {
            "Comment": "Kueue AZ placement orchestration",
            "StartAt": "InvokeWorker",
            "States": {
              "InvokeWorker": {
                "Type": "Task",
                "Resource": "arn:aws:states:::lambda:invoke",
                "Parameters": {
                  "FunctionName": "${KueueAzPlacementFunction}",
                  "Payload": {
                    "RequestType.$": "$.RequestType",
                    "Attempt.$": "$.Attempt",
                    "MaxAttempts.$": "$.MaxAttempts",
                    "DelaySeconds.$": "$.DelaySeconds"
                  }
                },
                "ResultSelector": {
                  "Status.$": "$.Payload.Status",
                  "Reason.$": "$.Payload.Reason",
                  "Data.$": "$.Payload.Data",
                  "Attempt.$": "$.Payload.Attempt",
                  "MaxAttempts.$": "$.Payload.MaxAttempts",
                  "DelaySeconds.$": "$.Payload.DelaySeconds"
                },
                "ResultPath": "$.Worker",
                "Next": "SetAttempt",
                "Catch": [
                  {
                    "ErrorEquals": ["States.ALL"],
                    "ResultPath": "$.WorkerError",
                    "Next": "SendFailureFromException"
                  }
                ]
              },
              "SetAttempt": {
                "Type": "Pass",
                "Parameters": {
                  "RequestType.$": "$.RequestType",
                  "ResponseURL.$": "$.ResponseURL",
                  "StackId.$": "$.StackId",
                  "RequestId.$": "$.RequestId",
                  "LogicalResourceId.$": "$.LogicalResourceId",
                  "PhysicalResourceId.$": "$.PhysicalResourceId",
                  "Attempt.$": "$.Worker.Attempt",
                  "MaxAttempts.$": "$.Worker.MaxAttempts",
                  "DelaySeconds.$": "$.Worker.DelaySeconds",
                  "Worker.$": "$.Worker"
                },
                "ResultPath": "$",
                "Next": "CheckStatus"
              },
              "CheckStatus": {
                "Type": "Choice",
                "Choices": [
                  {
                    "Variable": "$.Worker.Status",
                    "StringEquals": "SUCCESS",
                    "Next": "SendSuccess"
                  },
                  {
                    "Variable": "$.Worker.Status",
                    "StringEquals": "NOT_READY",
                    "Next": "CheckAttempts"
                  }
                ],
                "Default": "SendFailure"
              },
              "CheckAttempts": {
                "Type": "Choice",
                "Choices": [
                  {
                    "Variable": "$.Worker.Attempt",
                    "NumericGreaterThanEqualsPath": "$.Worker.MaxAttempts",
                    "Next": "SendTimeoutFailure"
                  }
                ],
                "Default": "WaitBeforeRetry"
              },
              "WaitBeforeRetry": {
                "Type": "Wait",
                "SecondsPath": "$.Worker.DelaySeconds",
                "Next": "InvokeWorker"
              },
              "SendSuccess": {
                "Type": "Task",
                "Resource": "arn:aws:states:::lambda:invoke",
                "Parameters": {
                  "FunctionName": "${KueueAzPlacementResponseFunction}",
                  "Payload": {
                    "Status": "SUCCESS",
                    "Reason.$": "$.Worker.Reason",
                    "Data.$": "$.Worker.Data",
                    "ResponseURL.$": "$.ResponseURL",
                    "StackId.$": "$.StackId",
                    "RequestId.$": "$.RequestId",
                    "LogicalResourceId.$": "$.LogicalResourceId",
                    "PhysicalResourceId.$": "$.PhysicalResourceId"
                  }
                },
                "End": true
              },
              "SendFailure": {
                "Type": "Task",
                "Resource": "arn:aws:states:::lambda:invoke",
                "Parameters": {
                  "FunctionName": "${KueueAzPlacementResponseFunction}",
                  "Payload": {
                    "Status": "FAILED",
                    "Reason.$": "$.Worker.Reason",
                    "Data.$": "$.Worker.Data",
                    "ResponseURL.$": "$.ResponseURL",
                    "StackId.$": "$.StackId",
                    "RequestId.$": "$.RequestId",
                    "LogicalResourceId.$": "$.LogicalResourceId",
                    "PhysicalResourceId.$": "$.PhysicalResourceId"
                  }
                },
                "End": true
              },
              "SendTimeoutFailure": {
                "Type": "Task",
                "Resource": "arn:aws:states:::lambda:invoke",
                "Parameters": {
                  "FunctionName": "${KueueAzPlacementResponseFunction}",
                  "Payload": {
                    "Status": "FAILED",
                    "Reason": "Timed out waiting for Kueue readiness",
                    "Data": {
                      "Error": "Timed out waiting for Kueue readiness"
                    },
                    "ResponseURL.$": "$.ResponseURL",
                    "StackId.$": "$.StackId",
                    "RequestId.$": "$.RequestId",
                    "LogicalResourceId.$": "$.LogicalResourceId",
                    "PhysicalResourceId.$": "$.PhysicalResourceId"
                  }
                },
                "End": true
              },
              "SendFailureFromException": {
                "Type": "Task",
                "Resource": "arn:aws:states:::lambda:invoke",
                "Parameters": {
                  "FunctionName": "${KueueAzPlacementResponseFunction}",
                  "Payload": {
                    "Status": "FAILED",
                    "Reason.$": "$.WorkerError.Cause",
                    "Data": {
                      "Error.$": "$.WorkerError.Error"
                    },
                    "ResponseURL.$": "$.ResponseURL",
                    "StackId.$": "$.StackId",
                    "RequestId.$": "$.RequestId",
                    "LogicalResourceId.$": "$.LogicalResourceId",
                    "PhysicalResourceId.$": "$.PhysicalResourceId"
                  }
                },
                "End": true
              }
            }
          }

  KueueAzPlacementStarterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: ${ResourceNamePrefix}-kueue-az-placement-starter-role
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
        Version: '2012-10-17'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: KueueAzPlacementStartPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - states:StartExecution
                Resource:
                  Ref: KueueAzPlacementStateMachine

  KueueAzPlacementStarterFunction:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        S3Bucket:
          Ref: CustomResourceS3Bucket
        S3Key:
          Ref: StarterFunctionS3Key
      Environment:
        Variables:
          STATE_MACHINE_ARN:
            Ref: KueueAzPlacementStateMachine
          MAX_ATTEMPTS:
            Ref: StepFunctionMaxAttempts
          DELAY_SECONDS:
            Ref: StepFunctionDelaySeconds
      FunctionName:
        Fn::Sub: ${ResourceNamePrefix}-kueue-az-placement-starter
      Handler: lambda_function.handler
      Role:
        Fn::GetAtt:
          - KueueAzPlacementStarterRole
          - Arn
      Runtime: python3.12
      Timeout: 60
      MemorySize: 256

  KueueAzPlacementCustomResource:
    Type: AWS::CloudFormation::CustomResource
    DependsOn:
      - KueueAzPlacementStateMachine
    Properties:
      ServiceToken:
        Fn::GetAtt:
          - KueueAzPlacementStarterFunction
          - Arn

Outputs:
  KueueAzPlacementComplete:
    Description: Kueue AZ placement resources created
    Value: true
