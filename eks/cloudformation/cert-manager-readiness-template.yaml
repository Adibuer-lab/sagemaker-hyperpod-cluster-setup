Description: Wait for cert-manager add-on to be ready before deploying dependent resources

Parameters:
  ResourceNamePrefix:
    Type: String
    Default: sagemaker-hyperpod-eks
  EKSClusterName:
    Type: String
  CustomResourceS3Bucket:
    Type: String
    Default: aws-sagemaker-hyperpod-cluster-setup-us-east-2-prod
  LayerS3Key:
    Type: String
    Default: resources/artifacts/ds-setup-lambda-layer.zip
    Description: Lambda layer with kubectl and aws-iam-authenticator
  FunctionS3Key:
    Type: String
    Default: resources/artifacts/cert-manager-readiness-lambda-function.zip
  StarterFunctionS3Key:
    Type: String
    Default: resources/artifacts/cfn-stepfunction-starter-lambda-function.zip
  ResponseFunctionS3Key:
    Type: String
    Default: resources/artifacts/cfn-response-sender-lambda-function.zip
  StepFunctionMaxAttempts:
    Type: Number
    Default: 45
  StepFunctionDelaySeconds:
    Type: Number
    Default: 60
  CertManagerNamespace:
    Type: String
    Default: cert-manager
  CertManagerDeployments:
    Type: String
    Default: cert-manager,cert-manager-webhook,cert-manager-cainjector
    Description: Comma-separated list of cert-manager deployment names to verify

Resources:
  CertManagerReadinessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: ${ResourceNamePrefix}-cert-manager-readiness-role
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
        Version: '2012-10-17'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: eks:DescribeCluster
                Resource:
                  Fn::Sub: arn:aws:eks:${AWS::Region}:${AWS::AccountId}:cluster/${EKSClusterName}
          PolicyName: EKSAccess

  CertManagerReadinessAccessEntry:
    Type: AWS::EKS::AccessEntry
    Properties:
      AccessPolicies:
        - AccessScope:
            Type: cluster
          PolicyArn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
      ClusterName:
        Ref: EKSClusterName
      PrincipalArn:
        Fn::GetAtt:
          - CertManagerReadinessRole
          - Arn

  CertManagerReadinessLayer:
    Type: AWS::Lambda::LayerVersion
    Properties:
      CompatibleArchitectures:
        - x86_64
      CompatibleRuntimes:
        - python3.9
        - python3.10
        - python3.11
        - python3.12
      Content:
        S3Bucket:
          Ref: CustomResourceS3Bucket
        S3Key:
          Ref: LayerS3Key
      Description: Lambda layer for kubectl and aws-iam-authenticator
      LayerName:
        Fn::Sub: ${ResourceNamePrefix}-cert-manager-readiness-layer

  CertManagerReadinessFunction:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        S3Bucket:
          Ref: CustomResourceS3Bucket
        S3Key:
          Ref: FunctionS3Key
      Environment:
        Variables:
          EKS_CLUSTER_NAME:
            Ref: EKSClusterName
          CERT_MANAGER_NAMESPACE:
            Ref: CertManagerNamespace
          CERT_MANAGER_DEPLOYMENTS:
            Ref: CertManagerDeployments
          PATH: /opt/python/bin:/var/lang/bin:/usr/local/bin:/usr/bin/:/bin
          KUBECONFIG: /tmp/.kube/config
          LD_LIBRARY_PATH: /opt/python/lib
      FunctionName:
        Fn::Sub: ${ResourceNamePrefix}-cert-manager-readiness
      Handler: lambda_function.handler
      Layers:
        - Ref: CertManagerReadinessLayer
      Role:
        Fn::GetAtt:
          - CertManagerReadinessRole
          - Arn
      Runtime: python3.12
      Timeout: 600
    DependsOn:
      - CertManagerReadinessAccessEntry

  CertManagerReadinessResponseRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
        Version: '2012-10-17'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  CertManagerReadinessResponseFunction:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        S3Bucket:
          Ref: CustomResourceS3Bucket
        S3Key:
          Ref: ResponseFunctionS3Key
      FunctionName:
        Fn::Sub: ${ResourceNamePrefix}-cert-manager-readiness-response
      Handler: lambda_function.handler
      Role:
        Fn::GetAtt:
          - CertManagerReadinessResponseRole
          - Arn
      Runtime: python3.12
      Timeout: 60
      MemorySize: 256

  CertManagerReadinessStateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: states.amazonaws.com
        Version: '2012-10-17'
      Policies:
        - PolicyName: CertManagerReadinessStateMachinePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - Fn::GetAtt:
                      - CertManagerReadinessFunction
                      - Arn
                  - Fn::GetAtt:
                      - CertManagerReadinessResponseFunction
                      - Arn

  CertManagerReadinessStateMachine:
    Type: AWS::StepFunctions::StateMachine
    DependsOn:
      - CertManagerReadinessFunction
      - CertManagerReadinessResponseFunction
    Properties:
      StateMachineName:
        Fn::Sub: ${ResourceNamePrefix}-cert-manager-readiness-sfn
      StateMachineType: STANDARD
      RoleArn:
        Fn::GetAtt:
          - CertManagerReadinessStateMachineRole
          - Arn
      DefinitionString:
        Fn::Sub: |
          {
            "Comment": "Cert-manager readiness orchestration",
            "StartAt": "InvokeWorker",
            "States": {
              "InvokeWorker": {
                "Type": "Task",
                "Resource": "arn:aws:states:::lambda:invoke",
                "Parameters": {
                  "FunctionName": "${CertManagerReadinessFunction}",
                  "Payload": {
                    "RequestType.$": "$.RequestType",
                    "Attempt.$": "$.Attempt",
                    "MaxAttempts.$": "$.MaxAttempts",
                    "DelaySeconds.$": "$.DelaySeconds"
                  }
                },
                "ResultSelector": {
                  "Status.$": "$.Payload.Status",
                  "Reason.$": "$.Payload.Reason",
                  "Data.$": "$.Payload.Data",
                  "Attempt.$": "$.Payload.Attempt",
                  "MaxAttempts.$": "$.Payload.MaxAttempts",
                  "DelaySeconds.$": "$.Payload.DelaySeconds"
                },
                "ResultPath": "$.Worker",
                "Next": "SetAttempt",
                "Catch": [
                  {
                    "ErrorEquals": ["States.ALL"],
                    "ResultPath": "$.WorkerError",
                    "Next": "SendFailureFromException"
                  }
                ]
              },
              "SetAttempt": {
                "Type": "Pass",
                "Parameters": {
                  "RequestType.$": "$.RequestType",
                  "ResponseURL.$": "$.ResponseURL",
                  "StackId.$": "$.StackId",
                  "RequestId.$": "$.RequestId",
                  "LogicalResourceId.$": "$.LogicalResourceId",
                  "PhysicalResourceId.$": "$.PhysicalResourceId",
                  "Attempt.$": "$.Worker.Attempt",
                  "MaxAttempts.$": "$.Worker.MaxAttempts",
                  "DelaySeconds.$": "$.Worker.DelaySeconds",
                  "Worker.$": "$.Worker"
                },
                "ResultPath": "$",
                "Next": "CheckStatus"
              },
              "CheckStatus": {
                "Type": "Choice",
                "Choices": [
                  {
                    "Variable": "$.Worker.Status",
                    "StringEquals": "SUCCESS",
                    "Next": "SendSuccess"
                  },
                  {
                    "Variable": "$.Worker.Status",
                    "StringEquals": "NOT_READY",
                    "Next": "CheckAttempts"
                  }
                ],
                "Default": "SendFailure"
              },
              "CheckAttempts": {
                "Type": "Choice",
                "Choices": [
                  {
                    "Variable": "$.Worker.Attempt",
                    "NumericGreaterThanEqualsPath": "$.Worker.MaxAttempts",
                    "Next": "SendTimeoutFailure"
                  }
                ],
                "Default": "WaitBeforeRetry"
              },
              "WaitBeforeRetry": {
                "Type": "Wait",
                "SecondsPath": "$.Worker.DelaySeconds",
                "Next": "InvokeWorker"
              },
              "SendSuccess": {
                "Type": "Task",
                "Resource": "arn:aws:states:::lambda:invoke",
                "Parameters": {
                  "FunctionName": "${CertManagerReadinessResponseFunction}",
                  "Payload": {
                    "Status": "SUCCESS",
                    "Reason.$": "$.Worker.Reason",
                    "Data.$": "$.Worker.Data",
                    "ResponseURL.$": "$.ResponseURL",
                    "StackId.$": "$.StackId",
                    "RequestId.$": "$.RequestId",
                    "LogicalResourceId.$": "$.LogicalResourceId",
                    "PhysicalResourceId.$": "$.PhysicalResourceId"
                  }
                },
                "End": true
              },
              "SendFailure": {
                "Type": "Task",
                "Resource": "arn:aws:states:::lambda:invoke",
                "Parameters": {
                  "FunctionName": "${CertManagerReadinessResponseFunction}",
                  "Payload": {
                    "Status": "FAILED",
                    "Reason.$": "$.Worker.Reason",
                    "Data.$": "$.Worker.Data",
                    "ResponseURL.$": "$.ResponseURL",
                    "StackId.$": "$.StackId",
                    "RequestId.$": "$.RequestId",
                    "LogicalResourceId.$": "$.LogicalResourceId",
                    "PhysicalResourceId.$": "$.PhysicalResourceId"
                  }
                },
                "End": true
              },
              "SendTimeoutFailure": {
                "Type": "Task",
                "Resource": "arn:aws:states:::lambda:invoke",
                "Parameters": {
                  "FunctionName": "${CertManagerReadinessResponseFunction}",
                  "Payload": {
                    "Status": "FAILED",
                    "Reason": "Timed out waiting for cert-manager readiness",
                    "Data": {
                      "Error": "Timed out waiting for cert-manager readiness"
                    },
                    "ResponseURL.$": "$.ResponseURL",
                    "StackId.$": "$.StackId",
                    "RequestId.$": "$.RequestId",
                    "LogicalResourceId.$": "$.LogicalResourceId",
                    "PhysicalResourceId.$": "$.PhysicalResourceId"
                  }
                },
                "End": true
              },
              "SendFailureFromException": {
                "Type": "Task",
                "Resource": "arn:aws:states:::lambda:invoke",
                "Parameters": {
                  "FunctionName": "${CertManagerReadinessResponseFunction}",
                  "Payload": {
                    "Status": "FAILED",
                    "Reason.$": "$.WorkerError.Cause",
                    "Data": {
                      "Error.$": "$.WorkerError.Error"
                    },
                    "ResponseURL.$": "$.ResponseURL",
                    "StackId.$": "$.StackId",
                    "RequestId.$": "$.RequestId",
                    "LogicalResourceId.$": "$.LogicalResourceId",
                    "PhysicalResourceId.$": "$.PhysicalResourceId"
                  }
                },
                "End": true
              }
            }
          }

  CertManagerReadinessStarterRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
        Version: '2012-10-17'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CertManagerReadinessStartPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - states:StartExecution
                Resource:
                  Ref: CertManagerReadinessStateMachine

  CertManagerReadinessStarterFunction:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        S3Bucket:
          Ref: CustomResourceS3Bucket
        S3Key:
          Ref: StarterFunctionS3Key
      Environment:
        Variables:
          STATE_MACHINE_ARN:
            Ref: CertManagerReadinessStateMachine
          MAX_ATTEMPTS:
            Ref: StepFunctionMaxAttempts
          DELAY_SECONDS:
            Ref: StepFunctionDelaySeconds
      FunctionName:
        Fn::Sub: ${ResourceNamePrefix}-cert-manager-readiness-starter
      Handler: lambda_function.handler
      Role:
        Fn::GetAtt:
          - CertManagerReadinessStarterRole
          - Arn
      Runtime: python3.12
      Timeout: 60
      MemorySize: 256

  CertManagerReadinessCustomResource:
    Type: AWS::CloudFormation::CustomResource
    DependsOn:
      - CertManagerReadinessStateMachine
    Properties:
      ServiceToken:
        Fn::GetAtt:
          - CertManagerReadinessStarterFunction
          - Arn

Outputs:
  CertManagerReadinessComplete:
    Description: Cert-manager readiness check complete
    Value: true
