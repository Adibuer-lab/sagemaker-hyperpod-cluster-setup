Parameters:
  EKSClusterName:
    Type: String
    Description: Name of the EKS cluster
  HyperPodClusterArn:
    Type: String
    Description: ARN of the HyperPod cluster
  TaskGovernanceAddonLambdaExportSuffix:
    Type: String
    Default: default
    Description: Suffix to ensure Task Governance Lambda export names are unique per deployment
  TaskGovernanceAddonVersion:
    Type: String
    Default: ''
    Description: >-
      Optional. Version of the HyperPod task governance EKS add-on to install. Leave empty to use the latest version
      recommended by Amazon EKS.
Conditions:
  TaskGovernanceAddonVersionProvided:
    Fn::Not:
      - Fn::Equals:
          - Ref: TaskGovernanceAddonVersion
          - ''
Resources:
  TaskGovernanceAddOn:
    Type: AWS::EKS::Addon
    Properties:
      AddonName: amazon-sagemaker-hyperpod-taskgovernance
      AddonVersion:
        Fn::If:
          - TaskGovernanceAddonVersionProvided
          - Ref: TaskGovernanceAddonVersion
          - Ref: AWS::NoValue
      ClusterName:
        Ref: EKSClusterName
      ResolveConflicts: OVERWRITE
    Metadata:
      aws:cdk:path: TaskGovernanceClusterPolicyCfnTemplate/TaskGovernanceAddOn
  ClusterSchedulerConfig:
    Type: Custom::ClusterSchedulerConfig
    Properties:
      ServiceToken:
        Fn::ImportValue:
          Fn::Sub: TaskGovernanceAddonLambdaArn-${TaskGovernanceAddonLambdaExportSuffix}
      ClusterArn:
        Ref: HyperPodClusterArn
      Name:
        Fn::Sub: ${EKSClusterName}-scheduler-config
      Description: >-
        Cluster configuration policy to streamline priority for tasks and idle compute management with first-come,
        first-served allocation for idle compute
      SchedulerConfig:
        FairShare: Disabled
        PriorityClasses:
          - Name: inference
            Weight: 100
          - Name: experimentation
            Weight: 90
          - Name: training
            Weight: 80
          - Name: fine-tuning
            Weight: 70
          - Name: interactive
            Weight: 60
    DependsOn:
      - TaskGovernanceAddOn
    Metadata:
      aws:cdk:path: TaskGovernanceClusterPolicyCfnTemplate/ClusterSchedulerConfig
Outputs:
  ClusterSchedulerConfigArn:
    Description: ARN of the cluster scheduler configuration
    Value:
      Fn::GetAtt:
        - ClusterSchedulerConfig
        - ClusterSchedulerConfigArn
  ClusterSchedulerConfigId:
    Description: ID of the cluster scheduler configuration
    Value:
      Fn::GetAtt:
        - ClusterSchedulerConfig
        - ClusterSchedulerConfigId
  TaskGovernanceAddonName:
    Description: Name of the task governance addon
    Value:
      Ref: TaskGovernanceAddOn
