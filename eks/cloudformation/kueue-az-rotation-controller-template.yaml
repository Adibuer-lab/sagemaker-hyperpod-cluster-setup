Description: Deploy AZ rotation controller for Kueue workloads

Parameters:
  ResourceNamePrefix:
    Type: String
    Default: sagemaker-hyperpod-eks
  EKSClusterName:
    Type: String
  CustomResourceS3Bucket:
    Type: String
    Default: aws-sagemaker-hyperpod-cluster-setup-us-east-2-prod
  LayerS3Key:
    Type: String
    Default: resources/artifacts/ds-setup-lambda-layer.zip
    Description: Lambda layer with kubectl and aws-iam-authenticator
  FunctionS3Key:
    Type: String
    Default: resources/artifacts/kueue-az-rotation-controller-lambda-function.zip
  StarterFunctionS3Key:
    Type: String
    Default: resources/artifacts/cfn-stepfunction-starter-lambda-function.zip
  ResponseFunctionS3Key:
    Type: String
    Default: resources/artifacts/cfn-response-sender-lambda-function.zip
  StepFunctionMaxAttempts:
    Type: Number
    Default: 30
  StepFunctionDelaySeconds:
    Type: Number
    Default: 30
  EksAvailabilityZones:
    Type: String
    Description: Comma-separated list of EKS-eligible AZ names
  UserNamespaces:
    Type: String
    Description: Comma-separated list of user workload namespaces
  KueueLocalQueueName:
    Type: String
    Default: nemo-az-localqueue
  FsxAvailabilityZoneId:
    Type: String
    Default: ''
  FsxSubnetId:
    Type: String
    Default: ''
  KueueAzRotationImage:
    Type: String
    Description: Container image URI for the AZ rotation controller
  KueueAzRotationNamespace:
    Type: String
    Default: kueue-system
  KueueAzRotationServiceAccount:
    Type: String
    Default: nemo-az-rotation-controller
  KueueAzRotationLogLevel:
    Type: String
    Default: INFO
  KueueAzRotationMaxRotations:
    Type: Number
    Default: 0
  KueueAzRotationEvictionReason:
    Type: String
    Default: PodsReadyTimeout
  KueueAzRotationMinEvictions:
    Type: Number
    Default: 2
  KueueAzRotationCooldownSeconds:
    Type: Number
    Default: 900

Resources:
  KueueAzRotationControllerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: ${ResourceNamePrefix}-kueue-az-rotation-controller-role
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
        Version: '2012-10-17'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: eks:DescribeCluster
                Resource:
                  Fn::Sub: arn:aws:eks:${AWS::Region}:${AWS::AccountId}:cluster/${EKSClusterName}
              - Effect: Allow
                Action:
                  - ec2:DescribeSubnets
                  - ec2:DescribeAvailabilityZones
                Resource: '*'
          PolicyName: EKSAccess

  KueueAzRotationControllerAccessEntry:
    Type: AWS::EKS::AccessEntry
    Properties:
      AccessPolicies:
        - AccessScope:
            Type: cluster
          PolicyArn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
      ClusterName:
        Ref: EKSClusterName
      PrincipalArn:
        Fn::GetAtt:
          - KueueAzRotationControllerRole
          - Arn

  KueueAzRotationControllerLayer:
    Type: AWS::Lambda::LayerVersion
    Properties:
      CompatibleArchitectures:
        - x86_64
      CompatibleRuntimes:
        - python3.9
        - python3.10
        - python3.11
        - python3.12
      Content:
        S3Bucket:
          Ref: CustomResourceS3Bucket
        S3Key:
          Ref: LayerS3Key
      Description: Lambda layer for kubectl and aws-iam-authenticator
      LayerName:
        Fn::Sub: ${ResourceNamePrefix}-kueue-az-rotation-controller-layer

  KueueAzRotationControllerFunction:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        S3Bucket:
          Ref: CustomResourceS3Bucket
        S3Key:
          Ref: FunctionS3Key
      Environment:
        Variables:
          EKS_CLUSTER_NAME:
            Ref: EKSClusterName
          EKS_AZ_NAMES:
            Ref: EksAvailabilityZones
          USER_NAMESPACES:
            Ref: UserNamespaces
          KUEUE_LOCAL_QUEUE_NAME:
            Ref: KueueLocalQueueName
          FSX_AVAILABILITY_ZONE_ID:
            Ref: FsxAvailabilityZoneId
          FSX_SUBNET_ID:
            Ref: FsxSubnetId
          ROTATION_IMAGE:
            Ref: KueueAzRotationImage
          ROTATION_NAMESPACE:
            Ref: KueueAzRotationNamespace
          ROTATION_SERVICE_ACCOUNT:
            Ref: KueueAzRotationServiceAccount
          ROTATION_LOG_LEVEL:
            Ref: KueueAzRotationLogLevel
          ROTATION_MAX_ROTATIONS:
            Ref: KueueAzRotationMaxRotations
          ROTATION_EVICTION_REASON:
            Ref: KueueAzRotationEvictionReason
          ROTATION_MIN_EVICTIONS:
            Ref: KueueAzRotationMinEvictions
          ROTATION_COOLDOWN_SECONDS:
            Ref: KueueAzRotationCooldownSeconds
          PATH: /opt/python/bin:/var/lang/bin:/usr/local/bin:/usr/bin/:/bin
          KUBECONFIG: /tmp/.kube/config
          LD_LIBRARY_PATH: /opt/python/lib
      FunctionName:
        Fn::Sub: ${ResourceNamePrefix}-kueue-az-rotation-controller
      Handler: lambda_function.handler
      Layers:
        - Ref: KueueAzRotationControllerLayer
      Role:
        Fn::GetAtt:
          - KueueAzRotationControllerRole
          - Arn
      Runtime: python3.12
      Timeout: 300
    DependsOn:
      - KueueAzRotationControllerAccessEntry

  KueueAzRotationResponseRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
        Version: '2012-10-17'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  KueueAzRotationResponseFunction:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        S3Bucket:
          Ref: CustomResourceS3Bucket
        S3Key:
          Ref: ResponseFunctionS3Key
      FunctionName:
        Fn::Sub: ${ResourceNamePrefix}-kueue-az-rotation-response
      Handler: lambda_function.handler
      Role:
        Fn::GetAtt:
          - KueueAzRotationResponseRole
          - Arn
      Runtime: python3.12
      Timeout: 60
      MemorySize: 256

  KueueAzRotationStateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: states.amazonaws.com
        Version: '2012-10-17'
      Policies:
        - PolicyName: KueueAzRotationStateMachinePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - Fn::GetAtt:
                      - KueueAzRotationControllerFunction
                      - Arn
                  - Fn::GetAtt:
                      - KueueAzRotationResponseFunction
                      - Arn

  KueueAzRotationStateMachine:
    Type: AWS::StepFunctions::StateMachine
    DependsOn:
      - KueueAzRotationControllerFunction
      - KueueAzRotationResponseFunction
    Properties:
      StateMachineName:
        Fn::Sub: ${ResourceNamePrefix}-kueue-az-rotation-sfn
      StateMachineType: STANDARD
      RoleArn:
        Fn::GetAtt:
          - KueueAzRotationStateMachineRole
          - Arn
      DefinitionString:
        Fn::Sub: |
          {
            "Comment": "Kueue AZ rotation controller orchestration",
            "StartAt": "InvokeWorker",
            "States": {
              "InvokeWorker": {
                "Type": "Task",
                "Resource": "arn:aws:states:::lambda:invoke",
                "Parameters": {
                  "FunctionName": "${KueueAzRotationControllerFunction}",
                  "Payload": {
                    "RequestType.$": "$.RequestType",
                    "Attempt.$": "$.Attempt",
                    "MaxAttempts.$": "$.MaxAttempts",
                    "DelaySeconds.$": "$.DelaySeconds"
                  }
                },
                "ResultSelector": {
                  "Status.$": "$.Payload.Status",
                  "Reason.$": "$.Payload.Reason",
                  "Data.$": "$.Payload.Data",
                  "Attempt.$": "$.Payload.Attempt",
                  "MaxAttempts.$": "$.Payload.MaxAttempts",
                  "DelaySeconds.$": "$.Payload.DelaySeconds"
                },
                "ResultPath": "$.Worker",
                "Next": "SetAttempt",
                "Catch": [
                  {
                    "ErrorEquals": ["States.ALL"],
                    "ResultPath": "$.WorkerError",
                    "Next": "SendFailureFromException"
                  }
                ]
              },
              "SetAttempt": {
                "Type": "Pass",
                "Parameters": {
                  "RequestType.$": "$.RequestType",
                  "ResponseURL.$": "$.ResponseURL",
                  "StackId.$": "$.StackId",
                  "RequestId.$": "$.RequestId",
                  "LogicalResourceId.$": "$.LogicalResourceId",
                  "PhysicalResourceId.$": "$.PhysicalResourceId",
                  "Attempt.$": "$.Worker.Attempt",
                  "MaxAttempts.$": "$.Worker.MaxAttempts",
                  "DelaySeconds.$": "$.Worker.DelaySeconds",
                  "Worker.$": "$.Worker"
                },
                "ResultPath": "$",
                "Next": "CheckStatus"
              },
              "CheckStatus": {
                "Type": "Choice",
                "Choices": [
                  {
                    "Variable": "$.Worker.Status",
                    "StringEquals": "SUCCESS",
                    "Next": "SendSuccess"
                  },
                  {
                    "Variable": "$.Worker.Status",
                    "StringEquals": "NOT_READY",
                    "Next": "CheckAttempts"
                  }
                ],
                "Default": "SendFailure"
              },
              "CheckAttempts": {
                "Type": "Choice",
                "Choices": [
                  {
                    "Variable": "$.Worker.Attempt",
                    "NumericGreaterThanEqualsPath": "$.Worker.MaxAttempts",
                    "Next": "SendTimeoutFailure"
                  }
                ],
                "Default": "WaitBeforeRetry"
              },
              "WaitBeforeRetry": {
                "Type": "Wait",
                "SecondsPath": "$.Worker.DelaySeconds",
                "Next": "InvokeWorker"
              },
              "SendSuccess": {
                "Type": "Task",
                "Resource": "arn:aws:states:::lambda:invoke",
                "Parameters": {
                  "FunctionName": "${KueueAzRotationResponseFunction}",
                  "Payload": {
                    "Status": "SUCCESS",
                    "Reason.$": "$.Worker.Reason",
                    "Data.$": "$.Worker.Data",
                    "ResponseURL.$": "$.ResponseURL",
                    "StackId.$": "$.StackId",
                    "RequestId.$": "$.RequestId",
                    "LogicalResourceId.$": "$.LogicalResourceId",
                    "PhysicalResourceId.$": "$.PhysicalResourceId"
                  }
                },
                "End": true
              },
              "SendFailure": {
                "Type": "Task",
                "Resource": "arn:aws:states:::lambda:invoke",
                "Parameters": {
                  "FunctionName": "${KueueAzRotationResponseFunction}",
                  "Payload": {
                    "Status": "FAILED",
                    "Reason.$": "$.Worker.Reason",
                    "Data.$": "$.Worker.Data",
                    "ResponseURL.$": "$.ResponseURL",
                    "StackId.$": "$.StackId",
                    "RequestId.$": "$.RequestId",
                    "LogicalResourceId.$": "$.LogicalResourceId",
                    "PhysicalResourceId.$": "$.PhysicalResourceId"
                  }
                },
                "End": true
              },
              "SendTimeoutFailure": {
                "Type": "Task",
                "Resource": "arn:aws:states:::lambda:invoke",
                "Parameters": {
                  "FunctionName": "${KueueAzRotationResponseFunction}",
                  "Payload": {
                    "Status": "FAILED",
                    "Reason": "Timed out waiting for rotation controller readiness",
                    "Data": {
                      "Error": "Timed out waiting for rotation controller readiness"
                    },
                    "ResponseURL.$": "$.ResponseURL",
                    "StackId.$": "$.StackId",
                    "RequestId.$": "$.RequestId",
                    "LogicalResourceId.$": "$.LogicalResourceId",
                    "PhysicalResourceId.$": "$.PhysicalResourceId"
                  }
                },
                "End": true
              },
              "SendFailureFromException": {
                "Type": "Task",
                "Resource": "arn:aws:states:::lambda:invoke",
                "Parameters": {
                  "FunctionName": "${KueueAzRotationResponseFunction}",
                  "Payload": {
                    "Status": "FAILED",
                    "Reason.$": "$.WorkerError.Cause",
                    "Data": {
                      "Error.$": "$.WorkerError.Error"
                    },
                    "ResponseURL.$": "$.ResponseURL",
                    "StackId.$": "$.StackId",
                    "RequestId.$": "$.RequestId",
                    "LogicalResourceId.$": "$.LogicalResourceId",
                    "PhysicalResourceId.$": "$.PhysicalResourceId"
                  }
                },
                "End": true
              }
            }
          }

  KueueAzRotationStarterRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
        Version: '2012-10-17'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: KueueAzRotationStartPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - states:StartExecution
                Resource:
                  Ref: KueueAzRotationStateMachine

  KueueAzRotationStarterFunction:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        S3Bucket:
          Ref: CustomResourceS3Bucket
        S3Key:
          Ref: StarterFunctionS3Key
      Environment:
        Variables:
          STATE_MACHINE_ARN:
            Ref: KueueAzRotationStateMachine
          MAX_ATTEMPTS:
            Ref: StepFunctionMaxAttempts
          DELAY_SECONDS:
            Ref: StepFunctionDelaySeconds
      FunctionName:
        Fn::Sub: ${ResourceNamePrefix}-kueue-az-rotation-starter
      Handler: lambda_function.handler
      Role:
        Fn::GetAtt:
          - KueueAzRotationStarterRole
          - Arn
      Runtime: python3.12
      Timeout: 60
      MemorySize: 256

  KueueAzRotationControllerCustomResource:
    Type: AWS::CloudFormation::CustomResource
    DependsOn:
      - KueueAzRotationStateMachine
    Properties:
      ServiceToken:
        Fn::GetAtt:
          - KueueAzRotationStarterFunction
          - Arn

Outputs:
  KueueAzRotationControllerDeployed:
    Description: AZ rotation controller deployed
    Value: true
