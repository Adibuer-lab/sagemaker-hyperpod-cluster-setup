        SecurityGroupIds:
          # Combine the passed-in SG with EKS cluster SG so HyperPod nodes can communicate with
          # EKS control plane components (CoreDNS, Fargate pods). The EKS cluster auto-creates
          # a security group that only allows traffic from itself - HyperPod nodes need to be
