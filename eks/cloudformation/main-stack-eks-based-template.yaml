                - Outputs.VpcId
            - Ref: VpcId
        # Include EKS cluster security group so the IAM role has permissions to create ENIs
        # with both the user-provided SG and the EKS auto-created cluster SG
        SecurityGroupIds:
          Fn::If:
            - CreateEKSClusterStackCondition
            # When we create EKS: combine passed SG + EKS cluster SG
            - Fn::Join:
