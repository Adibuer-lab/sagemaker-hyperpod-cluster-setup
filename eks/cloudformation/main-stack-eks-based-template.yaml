  # =============================================================================
  # FSX WRITABLE DIRECTORY BOOTSTRAP (post-HyperPod)
  # Creates /fs-<id> with sticky bit so Spaces users can write.
  # Must run after HyperPod EC2 nodes exist (FSx CSI is not compatible with Fargate-only clusters).
  # =============================================================================
  FsxWritableDirBootstrapRole:
    Type: AWS::IAM::Role
    Condition: FsxWritableDirBootstrapCondition
    Properties:
      RoleName:
        Fn::Sub: ${ResourceNamePrefix}-fsx-bootstrap-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: EKSDescribeCluster
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - eks:DescribeCluster
                Resource:
                  Fn::If:
                    - CreateEKSClusterStackCondition
                    - Fn::GetAtt:
                        - EKSClusterStack
                        - Outputs.EKSClusterArn
                    - Fn::Sub: arn:aws:eks:${AWS::Region}:${AWS::AccountId}:cluster/${EKSClusterName}
    Metadata:
      aws:cdk:path: MainEksBasedCfnTemplate/FsxWritableDirBootstrapRole

  FsxWritableDirBootstrapAccessEntry:
    Type: AWS::EKS::AccessEntry
    Condition: FsxWritableDirBootstrapCondition
    Properties:
      ClusterName:
        Fn::If:
          - CreateEKSClusterStackCondition
          - Fn::GetAtt:
              - EKSClusterStack
              - Outputs.EKSClusterName
          - Ref: EKSClusterName
      PrincipalArn:
        Fn::GetAtt:
          - FsxWritableDirBootstrapRole
          - Arn
      Type: STANDARD
      AccessPolicies:
        - PolicyArn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
          AccessScope:
            Type: cluster
    Metadata:
      aws:cdk:path: MainEksBasedCfnTemplate/FsxWritableDirBootstrapAccessEntry

  FsxWritableDirBootstrapLayer:
    Type: AWS::Lambda::LayerVersion
    Condition: FsxWritableDirBootstrapCondition
    Properties:
      CompatibleArchitectures:
        - x86_64
      CompatibleRuntimes:
        - python3.9
        - python3.10
        - python3.11
        - python3.12
      Content:
        S3Bucket:
          Fn::If:
            - CustomBucketCondition
            - Ref: CustomBucketName
            - Fn::Sub: aws-sagemaker-hyperpod-cluster-setup-${AWS::Region}-${Stage}
        S3Key: resources/artifacts/fsx-lambda-layer.zip
      Description: Lambda Layer for kubectl and aws-iam-authenticator
      LayerName:
        Fn::Sub: ${ResourceNamePrefix}-fsx-bootstrap-layer
    Metadata:
      aws:cdk:path: MainEksBasedCfnTemplate/FsxWritableDirBootstrapLayer

  FsxWritableDirBootstrapFunction:
    Type: AWS::Lambda::Function
    Condition: FsxWritableDirBootstrapCondition
    DependsOn:
      - FsxWritableDirBootstrapAccessEntry
    Properties:
      FunctionName:
        Fn::Sub: ${ResourceNamePrefix}-fsx-bootstrap
      Runtime: python3.12
      Handler: lambda_function.lambda_handler
      Timeout: 900
      MemorySize: 512
      Role:
        Fn::GetAtt:
          - FsxWritableDirBootstrapRole
          - Arn
      Layers:
        - Ref: FsxWritableDirBootstrapLayer
      Environment:
        Variables:
          CLUSTER_NAME:
            Fn::If:
              - CreateEKSClusterStackCondition
              - Fn::GetAtt:
                  - EKSClusterStack
                  - Outputs.EKSClusterName
              - Ref: EKSClusterName
          FSX_FILE_SYSTEM_ID:
            Fn::GetAtt:
              - FsxStack
              - Outputs.FsxFileSystemId
          USER_NAMESPACES:
            Ref: UserNamespaces
          CUSTOM_USER_NAMESPACES:
            Ref: CustomUserNamespaces
          FSX_BOOTSTRAP_NODE_ROLE: system
          PATH: /opt/python/bin:/var/lang/bin:/usr/local/bin:/usr/bin/:/bin
          KUBECONFIG: /tmp/.kube/config
          LD_LIBRARY_PATH: /opt/python/lib
      Code:
        S3Bucket:
          Fn::If:
            - CustomBucketCondition
            - Ref: CustomBucketName
            - Fn::Sub: aws-sagemaker-hyperpod-cluster-setup-${AWS::Region}-${Stage}
        S3Key: resources/artifacts/fsx-lambda-function.zip
    Metadata:
      aws:cdk:path: MainEksBasedCfnTemplate/FsxWritableDirBootstrapFunction

  FsxWritableDirBootstrapWithQuotaWithKueue:
    Type: AWS::CloudFormation::CustomResource
    Condition: FsxBootstrapWithQuotaWithKueueCondition
    DependsOn:
      - FsxPvcPostTGWithQuotaWithKueue
      - HyperPodClusterStack
      - FsxWritableDirBootstrapFunction
    Properties:
      ServiceToken:
        Fn::GetAtt:
          - FsxWritableDirBootstrapFunction
          - Arn
      Action: BootstrapWritableSubdir
      NodeRole: system
    Metadata:
      aws:cdk:path: MainEksBasedCfnTemplate/FsxWritableDirBootstrapWithQuotaWithKueue

  FsxWritableDirBootstrapWithQuotaNoKueue:
    Type: AWS::CloudFormation::CustomResource
    Condition: FsxBootstrapWithQuotaNoKueueCondition
    DependsOn:
      - FsxPvcPostTGWithQuotaNoKueue
      - HyperPodClusterStack
      - FsxWritableDirBootstrapFunction
    Properties:
      ServiceToken:
        Fn::GetAtt:
          - FsxWritableDirBootstrapFunction
          - Arn
      Action: BootstrapWritableSubdir
      NodeRole: system
    Metadata:
      aws:cdk:path: MainEksBasedCfnTemplate/FsxWritableDirBootstrapWithQuotaNoKueue

  FsxWritableDirBootstrapNoQuotaWithKueue:
    Type: AWS::CloudFormation::CustomResource
    Condition: FsxBootstrapNoQuotaWithKueueCondition
    DependsOn:
      - FsxPvcPostTGNoQuotaWithKueue
      - HyperPodClusterStack
      - FsxWritableDirBootstrapFunction
    Properties:
      ServiceToken:
        Fn::GetAtt:
          - FsxWritableDirBootstrapFunction
          - Arn
      Action: BootstrapWritableSubdir
      NodeRole: system
    Metadata:
      aws:cdk:path: MainEksBasedCfnTemplate/FsxWritableDirBootstrapNoQuotaWithKueue

  FsxWritableDirBootstrapNoQuotaNoKueue:
    Type: AWS::CloudFormation::CustomResource
    Condition: FsxBootstrapNoQuotaNoKueueCondition
    DependsOn:
      - FsxPvcPostTGNoQuotaNoKueue
      - HyperPodClusterStack
      - FsxWritableDirBootstrapFunction
    Properties:
      ServiceToken:
        Fn::GetAtt:
          - FsxWritableDirBootstrapFunction
          - Arn
      Action: BootstrapWritableSubdir
      NodeRole: system
    Metadata:
      aws:cdk:path: MainEksBasedCfnTemplate/FsxWritableDirBootstrapNoQuotaNoKueue

  FsxWritableDirBootstrapNoTG:
    Type: AWS::CloudFormation::CustomResource
    Condition: FsxBootstrapNoTGCondition
    DependsOn:
      - FsxStack
      - HyperPodClusterStack
      - FsxWritableDirBootstrapFunction
    Properties:
