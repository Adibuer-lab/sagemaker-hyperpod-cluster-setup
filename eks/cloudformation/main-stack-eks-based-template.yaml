  # =============================================================================
  # KARPENTER NODEPOOL/NODECLASS SETUP
  # Creates HyperpodNodeClass and NodePool immediately after HyperPod cluster
  # so Karpenter can start scaling nodes as soon as possible
  # =============================================================================
  KarpenterSetupRole:
    Type: AWS::IAM::Role
    Condition: KarpenterEnabledCondition
    Properties:
      RoleName:
        Fn::Sub: ${ResourceNamePrefix}-karpenter-setup-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: KarpenterSetupPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - eks:DescribeCluster
                Resource:
                  Fn::If:
                    - CreateEKSClusterStackCondition
                    - Fn::GetAtt:
                        - EKSClusterStack
                        - Outputs.EKSClusterArn
                    - Fn::Sub: arn:aws:eks:${AWS::Region}:${AWS::AccountId}:cluster/${EKSClusterName}
              - Effect: Allow
                Action:
                  - sagemaker:DescribeCluster
                Resource:
                  Fn::GetAtt:
                    - HyperPodClusterStack
                    - Outputs.HyperPodClusterArn
              - Effect: Allow
                Action:
                  - sts:GetCallerIdentity
                Resource: '*'

  KarpenterSetupAccessEntry:
    Type: AWS::EKS::AccessEntry
    Condition: KarpenterEnabledCondition
    DependsOn: HyperPodClusterStack
    Properties:
      ClusterName:
        Fn::If:
          - CreateEKSClusterStackCondition
          - Fn::GetAtt:
              - EKSClusterStack
              - Outputs.EKSClusterName
          - Ref: EKSClusterName
      PrincipalArn:
        Fn::GetAtt:
          - KarpenterSetupRole
          - Arn
      Type: STANDARD
      AccessPolicies:
        - PolicyArn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
          AccessScope:
            Type: cluster

  HyperPodNodeWaiterAccessEntry:
    Type: AWS::EKS::AccessEntry
    Condition: EnableHyperPodNodeWaiterCondition
    DependsOn: HyperPodClusterStack
    Properties:
      ClusterName:
        Fn::If:
          - CreateEKSClusterStackCondition
          - Fn::GetAtt:
              - EKSClusterStack
              - Outputs.EKSClusterName
          - Ref: EKSClusterName
      PrincipalArn:
        Fn::GetAtt:
          - HyperPodAssociationWaiterRole
          - Arn
      Type: STANDARD
      AccessPolicies:
        - PolicyArn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
          AccessScope:
            Type: cluster

  KarpenterSetupFunction:
    Type: AWS::Lambda::Function
    Condition: KarpenterEnabledCondition
    DependsOn: KarpenterSetupAccessEntry
    Properties:
      FunctionName:
        Fn::Sub: ${ResourceNamePrefix}-karpenter-setup
      Runtime: python3.12
      Handler: lambda_function.handler
      Timeout: 300
      MemorySize: 256
      Role:
        Fn::GetAtt:
          - KarpenterSetupRole
          - Arn
      Environment:
        Variables:
          EKS_CLUSTER_NAME:
            Fn::If:
              - CreateEKSClusterStackCondition
              - Fn::GetAtt:
                  - EKSClusterStack
                  - Outputs.EKSClusterName
              - Ref: EKSClusterName
          HYPERPOD_CLUSTER_NAME:
            Fn::GetAtt:
              - HyperPodClusterStack
              - Outputs.HyperPodClusterName
          NODECLASS_NAME:
            Fn::Sub: ${ResourceNamePrefix}-nodeclass
          NODEPOOL_NAME:
            Fn::Sub: ${ResourceNamePrefix}-nodepool
      Code:
        S3Bucket:
          Fn::If:
            - CustomBucketCondition
            - Ref: CustomBucketName
            - Fn::Sub: aws-sagemaker-hyperpod-cluster-setup-${AWS::Region}-${Stage}
        S3Key: resources/artifacts/karpenter-setup-lambda-function.zip

  KarpenterSetup:
    Type: Custom::KarpenterSetup
    Condition: KarpenterEnabledCondition
    DependsOn:
      - HyperPodClusterStack
      - KarpenterSetupAccessEntry
    Properties:
      ServiceToken:
        Fn::GetAtt:
          - KarpenterSetupFunction
          - Arn

  HyperPodAssociationWaiterRole:
    Type: AWS::IAM::Role
    Condition: EnableHyperPodAssociationWaiterCondition
    Properties:
      RoleName:
        Fn::Sub: ${ResourceNamePrefix}-hp-association-waiter-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: HyperPodAssociationWaiterPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sagemaker:DescribeCluster
                  - sagemaker:ListClusterNodes
                Resource:
                  Fn::GetAtt:
                    - HyperPodClusterStack
                    - Outputs.HyperPodClusterArn
              - Effect: Allow
                Action:
                  - eks:DescribeCluster
                Resource:
                  Fn::If:
                    - CreateEKSClusterStackCondition
                    - Fn::GetAtt:
                        - EKSClusterStack
                        - Outputs.EKSClusterArn
                    - Fn::Sub: arn:aws:eks:${AWS::Region}:${AWS::AccountId}:cluster/${EKSClusterName}

  HyperPodAssociationWaiterFunction:
    Type: AWS::Lambda::Function
    Condition: EnableHyperPodAssociationWaiterCondition
    Properties:
      FunctionName:
        Fn::Sub: ${ResourceNamePrefix}-hp-association-waiter
      Runtime: python3.12
      Handler: lambda_function.handler
      Timeout: 900
      MemorySize: 256
      Role:
        Fn::GetAtt:
          - HyperPodAssociationWaiterRole
          - Arn
      Code:
        S3Bucket:
          Fn::If:
            - CustomBucketCondition
            - Ref: CustomBucketName
            - Fn::Sub: aws-sagemaker-hyperpod-cluster-setup-${AWS::Region}-${Stage}
        S3Key: resources/artifacts/hyperpod-association-waiter-lambda-function.zip

  HyperPodAssociationWaiter:
    Type: Custom::HyperPodAssociationWaiter
    Condition: EnableHyperPodAssociationWaiterCondition
    DependsOn:
      - HyperPodClusterStack
    Properties:
      ServiceToken:
        Fn::GetAtt:
          - HyperPodAssociationWaiterFunction
          - Arn
      HyperPodClusterName:
        Fn::GetAtt:
          - HyperPodClusterStack
