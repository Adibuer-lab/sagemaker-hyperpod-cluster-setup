Conditions:
  EnableHPInferenceFeatureCondition:
    Fn::Equals:
      - Ref: EnableHPInferenceFeature
      - 'true'
  EnableObservabilityFeatureCondition:
    Fn::And:
      - Fn::Equals:
          - Ref: EnableObservabilityFeature
          - 'true'
      - Fn::Equals:
          - Fn::FindInMap:
              - AMPRegionMapping
              - Ref: AWS::Region
              - isAllowed
              - DefaultValue: 'false'
          - 'true'
  EnableHPTrainingOperatorFeatureCondition:
    Fn::Equals:
      - Ref: EnableHPTrainingOperatorFeature
      - 'true'
  EnableSpacesFeatureCondition:
    Fn::Equals:
      - Ref: EnableSpacesFeature
      - 'true'
  CreateVPCStackCondition:
    Fn::Equals:
      - Ref: CreateVPCStack
      - 'true'
  CreatePrivateSubnetStackCondition:
    Fn::Equals:
      - Ref: CreateVPCStack
      - 'true'
  CreateSecurityGroupStackCondition:
    Fn::Equals:
      - Ref: CreateSecurityGroupStack
      - 'true'
  CreateEKSClusterStackCondition:
    Fn::Equals:
      - Ref: CreateEKSClusterStack
      - 'true'
  CreateS3BucketStackCondition:
    Fn::Equals:
      - Ref: CreateS3BucketStack
      - 'true'
  CreateS3EndpointStackCondition:
    Fn::Equals:
      - Ref: CreateS3EndpointStack
      - 'true'
  CreateLifeCycleScriptStackCondition:
    Fn::Equals:
      - Ref: CreateLifeCycleScriptStack
      - 'true'
  CreateSageMakerIAMRoleStackCondition:
    Fn::Equals:
      - Ref: CreateSageMakerIAMRoleStack
      - 'true'
  CreateHelmChartStackCondition:
    Fn::Equals:
      - Ref: CreateHelmChartStack
      - 'true'
  CreateHyperPodClusterStackCondition:
    Fn::And:
      - Fn::Equals:
          - Ref: CreateHyperPodClusterStack
          - 'true'
      - Fn::Not:
          - Fn::And:
              - Fn::Equals:
                  - Ref: CreateEKSClusterStack
                  - 'true'
              - Fn::Equals:
                  - Ref: CreateHelmChartStack
                  - 'false'
  CreateFsxStackCondition:
    Fn::Equals:
      - Ref: CreateFsxStack
      - 'true'
  FsxWritableDirBootstrapCondition:
    Fn::And:
      - Condition: CreateFsxStackCondition
      - Condition: CreateHyperPodClusterStackCondition
      - Condition: HasAnyWorkloadNamespaces
  CreateRigCondition:
    Fn::Not:
      - Fn::Equals:
          - Ref: RigSettings1
          - '[]'
  TieredKVCacheConfigCondition:
    Fn::And:
      - Fn::Equals:
          - Ref: CreateHyperPodClusterStack
          - 'true'
      - Fn::Equals:
          - Ref: CreateEKSClusterStack
          - 'true'
      - Fn::Not:
          - Fn::Equals:
              - Ref: TieredKVCacheConfig
              - ''
  InstallCertManagerCondition:
    Fn::Or:
      - Condition: EnableHPInferenceFeatureCondition
      - Condition: EnableHPTrainingOperatorFeatureCondition
  DataScientistSetupCondition:
    Fn::Or:
      - Fn::Not:
          - Fn::Equals:
              - Ref: DataScientistRole1
              - ''
      - Fn::Not:
          - Fn::Equals:
              - Ref: DataScientistRole2
              - ''
      - Fn::Not:
          - Fn::Equals:
              - Ref: DataScientistRole3
              - ''
      - Fn::Not:
          - Fn::Equals:
              - Ref: DataScientistRole4
              - ''
      - Fn::Not:
          - Fn::Equals:
              - Ref: DataScientistRole5
              - ''
      - Fn::Not:
          - Fn::Equals:
              - Ref: DataScientistRole6
              - ''
      - Fn::Not:
          - Fn::Equals:
              - Ref: DataScientistRole7
              - ''
      - Fn::Not:
          - Fn::Equals:
              - Ref: DataScientistRole8
              - ''
      - Fn::Not:
          - Fn::Equals:
              - Ref: DataScientistRole9
              - ''
      - Fn::Not:
          - Fn::Equals:
              - Ref: DataScientistRole10
              - ''
  DataScientistSetupNoTGCondition:
    Fn::And:
      - Condition: DataScientistSetupCondition
      - Condition: TaskGovernanceDisabledCondition
  DataScientistSetupTGCondition:
    Fn::And:
      - Condition: DataScientistSetupCondition
      - Condition: TaskGovernanceEnabledCondition
      - Condition: EnableTaskGovernanceComputeQuotaCondition
  CustomBucketCondition:
    Fn::Not:
      - Fn::Equals:
          - Ref: CustomBucketName
          - ''
  KarpenterEnabledCondition:
    Fn::And:
      - Fn::Equals:
          - Ref: AutoScalerType
          - Karpenter
      - Fn::Equals:
          - Ref: CreateHyperPodClusterStack
          - 'true'
  EnableTaskGovernanceClusterPolicyLambdaCondition:
    Fn::And:
      - Fn::Equals:
          - Ref: CreateEKSClusterStack
          - 'true'
      - Fn::Equals:
          - Ref: CreateTaskGovernanceClusterPolicyStack
          - 'true'
  EnableTaskGovernanceClusterPolicyCondition:
    Fn::And:
      - Fn::Equals:
          - Ref: CreateEKSClusterStack
          - 'true'
      - Fn::Equals:
          - Ref: CreateHyperPodClusterStack
          - 'true'
      - Fn::Equals:
          - Ref: CreateTaskGovernanceClusterPolicyStack
          - 'true'
  EnableKueueExternalFrameworkPatchCondition:
    Fn::And:
      - Fn::Equals:
          - Ref: CreateEKSClusterStack
          - 'true'
      - Fn::Equals:
          - Ref: CreateHyperPodClusterStack
          - 'true'
      - Fn::Equals:
          - Ref: CreateTaskGovernanceClusterPolicyStack
          - 'true'
      - Fn::Equals:
          - Ref: EnableKueueExternalFrameworkPatch
          - 'true'
  HasCustomUserNamespaces:
    Fn::Not:
      - Fn::Equals:
          - Ref: CustomUserNamespaces
          - ''
  HasUserNamespaces:
    Fn::Not:
      - Fn::Equals:
          - Ref: UserNamespaces
          - ''
  HasAnyWorkloadNamespaces:
    Fn::Or:
      - Condition: HasUserNamespaces
      - Condition: HasCustomUserNamespaces
  HasComputeQuotaInstanceType:
    Fn::Not:
      - Fn::Equals:
          - Ref: TaskGovernanceComputeQuotaInstanceType
          - ''
  HasComputeQuotaInstanceCount:
    Fn::Not:
      - Fn::Equals:
          - Ref: TaskGovernanceComputeQuotaInstanceCount
          - 0
  EnableTaskGovernanceComputeQuotaCondition:
    Fn::And:
      - Fn::Equals:
          - Ref: CreateTaskGovernanceClusterPolicyStack
          - 'true'
      - Condition: HasUserNamespaces
      - Condition: HasComputeQuotaInstanceType
      - Condition: HasComputeQuotaInstanceCount
  TaskGovernanceEnabledCondition:
    Fn::Equals:
      - Ref: CreateTaskGovernanceClusterPolicyStack
      - 'true'
  TaskGovernanceDisabledCondition:
    Fn::Not:
      - Condition: TaskGovernanceEnabledCondition
  EnableKueueAzPlacementResourcesCondition:
    Fn::And:
      - Fn::Equals:
          - Ref: CreateEKSClusterStack
          - 'true'
      - Fn::Equals:
          - Ref: CreateHyperPodClusterStack
          - 'true'
      - Fn::Equals:
          - Ref: CreateTaskGovernanceClusterPolicyStack
          - 'true'
      - Fn::Equals:
          - Ref: EnableKueueAzPlacementResources
          - 'true'
      - Condition: HasCustomUserNamespaces
  FsxPostTGPvcBaseCondition:
    Fn::And:
      - Condition: CreateFsxStackCondition
      - Condition: EnableTaskGovernanceClusterPolicyCondition
      - Condition: HasAnyWorkloadNamespaces
  FsxPostTGPvcWithQuotaWithKueueCondition:
    Fn::And:
      - Condition: FsxPostTGPvcBaseCondition
      - Condition: EnableTaskGovernanceComputeQuotaCondition
      - Condition: EnableKueueAzPlacementResourcesCondition
  FsxPostTGPvcWithQuotaNoKueueCondition:
    Fn::And:
      - Condition: FsxPostTGPvcBaseCondition
      - Condition: EnableTaskGovernanceComputeQuotaCondition
      - Fn::Not:
          - Condition: EnableKueueAzPlacementResourcesCondition
  FsxPostTGPvcNoQuotaWithKueueCondition:
    Fn::And:
      - Condition: FsxPostTGPvcBaseCondition
      - Fn::Not:
          - Condition: EnableTaskGovernanceComputeQuotaCondition
      - Condition: EnableKueueAzPlacementResourcesCondition
  FsxPostTGPvcNoQuotaNoKueueCondition:
    Fn::And:
      - Condition: FsxPostTGPvcBaseCondition
      - Fn::Not:
          - Condition: EnableTaskGovernanceComputeQuotaCondition
      - Fn::Not:
          - Condition: EnableKueueAzPlacementResourcesCondition
  FsxBootstrapWithQuotaWithKueueCondition:
    Fn::And:
      - Condition: FsxWritableDirBootstrapCondition
      - Condition: FsxPostTGPvcWithQuotaWithKueueCondition
  FsxBootstrapWithQuotaNoKueueCondition:
    Fn::And:
      - Condition: FsxWritableDirBootstrapCondition
      - Condition: FsxPostTGPvcWithQuotaNoKueueCondition
  FsxBootstrapNoQuotaWithKueueCondition:
    Fn::And:
      - Condition: FsxWritableDirBootstrapCondition
      - Condition: FsxPostTGPvcNoQuotaWithKueueCondition
  FsxBootstrapNoQuotaNoKueueCondition:
    Fn::And:
      - Condition: FsxWritableDirBootstrapCondition
      - Condition: FsxPostTGPvcNoQuotaNoKueueCondition
  FsxBootstrapNoTGCondition:
    Fn::And:
      - Condition: FsxWritableDirBootstrapCondition
      - Condition: TaskGovernanceDisabledCondition
  HasKueueAzRotationImage:
    Fn::Not:
      - Fn::Equals:
          - Ref: KueueAzRotationImage
          - ''
  EnableKueueAzRotationControllerCondition:
    Fn::And:
      - Fn::Equals:
          - Ref: CreateEKSClusterStack
          - 'true'
      - Fn::Equals:
          - Ref: CreateHyperPodClusterStack
          - 'true'
      - Fn::Equals:
          - Ref: CreateTaskGovernanceClusterPolicyStack
          - 'true'
      - Fn::Equals:
          - Ref: EnableKueueAzPlacementResources
          - 'true'
      - Fn::Equals:
          - Ref: EnableKueueAzRotationController
          - 'true'
      - Condition: HasKueueAzRotationImage
      - Condition: HasCustomUserNamespaces
  TaskGovernanceMetricLevelDisabled:
    Fn::Equals:
      - Ref: TaskGovernanceMetricLevel
      - 'DISABLED'
  EnableTaskGovernanceMetricsCondition:
    Fn::And:
      - Fn::Equals:
          - Ref: CreateTaskGovernanceClusterPolicyStack
          - 'true'
      - Condition: TaskGovernanceMetricLevelDisabled
  EnableObservabilityWithHyperPodCondition:
    Fn::And:
      - Condition: EnableObservabilityFeatureCondition
      - Condition: CreateHyperPodClusterStackCondition
  EnableHyperPodAssociationWaiterCondition:
    Fn::And:
      - Fn::Equals:
          - Ref: CreateHyperPodClusterStack
          - 'true'
      - Fn::Or:
          - Fn::Equals:
              - Ref: CreateTaskGovernanceClusterPolicyStack
              - 'true'
          - Fn::Equals:
              - Ref: EnableObservabilityFeature
              - 'true'
  EnableHyperPodNodeWaiterCondition:
    Fn::And:
      - Condition: KarpenterEnabledCondition
      - Fn::Equals:
          - Ref: CreateHyperPodClusterStack
          - 'true'
      - Fn::Or:
          - Fn::Equals:
              - Ref: CreateTaskGovernanceClusterPolicyStack
              - 'true'
          - Fn::Equals:
              - Ref: EnableObservabilityFeature
              - 'true'
Mappings:
  AMPRegionMapping:
    us-east-1:
      isAllowed: 'true'
    us-east-2:
      isAllowed: 'true'
    us-west-2:
      isAllowed: 'true'
    ap-south-1:
      isAllowed: 'true'
    ap-northeast-1:
      isAllowed: 'true'
    ap-northeast-2:
