    Default: ''
    Description: >-
      JSON string containing tiered storage configuration for the SageMaker HyperPod cluster. Format:
      {"InstanceMemoryAllocationPercentage": Integer (0-100), "Mode": String ("Enable" or "Disable")}. Only applicable
      for EKS-based clusters.
  TieredKVCacheConfig:
    Type: String
    Default: ''
    Description: >-
      JSON string containing tiered KV cache configuration. Format: {"KVCacheMode": "Enable", "InstanceGroup": ["ig-1",
      "ig-2"], "NVMeMode": "Enable"}. Only applicable for EKS-based clusters with P-series instances.
  DataScientistRole1:
    Type: String
    Default: ''
